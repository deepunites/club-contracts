    commandUpdate:
      name: command.update
      title: Команда update
      summary: Проверить/подготовить/применить обновление компонента (agent | shell).
      description: |
        Payload обязателен. `manifest` задан — агент скачивает `manifest.url` (Bearer, Range), проверяет SHA-256 и
        подпись и готовит пакет; `manifest` нет — агент сам запрашивает `GET /updates/{channel}/manifest`
        (в v1 notImplemented → сервер v1 обязан передавать manifest). `manifest.component` ≠ `component` — ack internal.

        `applyNow = true` — пакет применяется НЕМЕДЛЕННО, без проверки сессии и окна применения
        (`AgentUpdater.HandleCommandAsync`): для `component = agent` это перезапуск службы агента даже во время
        игровой сессии. Сервер отправляет `applyNow = true` только на свободный ПК (без открытой сессии).
        `applyNow = false` — пакет готовится, применение — по обычным правилам агента (сессия, окно, `mandatory`).

        Результат: `scheduled = true` — пакет подготовлен (при `applyNow = false`) или передан на применение (при
        `applyNow = true`). Сбой скачивания/проверки SHA-256 или подписи/подготовки, отсутствие ключа подписи на
        агенте, «нечего применять» и сбой применения приходят НЕ как `ack.error`, а как `ack.ok = true` +
        `result.scheduled = false` (подробности — только в логе агента и IPC `update.progress`).
      x-discrepancy: >-
        Doc-комментарий UpdateCommand.ApplyNow (src/ClubShell.Contracts/Commands/ServerCommand.cs:397, «subject to
        session/mandatory rules») расходится с кодом: src/ClubShell.Agent/Updates/AgentUpdater.cs:134-135 и :175-178
