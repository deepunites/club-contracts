    ackLaunchGame:
      name: ack.launchGame
      title: Ack команды launchGame
      summary: Результат — LaunchResult; провал запуска — ack.ok = true и result.ok = false.
      description: |
        `GameLaunchService.LaunchAsync` не бросает исключений при ошибках запуска, а возвращает
        `LaunchResult { ok: false, error }`; `CommandReceiver` без условий оборачивает его в `CommandAck.Success`.
        Поэтому провалившийся запуск на проводе выглядит так: `ack.ok = true`, `ack.result.ok = false`,
        `ack.result.error` = `IpcError`. Сервер, проверяющий только `ack.ok`, посчитает неудачный запуск успешным —
        обязательно проверять `ack.result.ok`.

        Коды в `ack.result.error.code`: `notFound` (игры нет в каталоге агента), `sessionNotActive` (нет активной
        сессии или чужой `sessionId`), `policyDenied`, `antiCheatBlocked`, `gameNotInstalled`, `gameLaunchFailed`
        (`details.stage`), `accountPoolExhausted`, `conflict` (`details.reason = alreadyRunning`), `timeout` (лаунчер не
        запустил процесс за `launchTimeoutSec`), а также коды из REST-вызовов агента при запуске (аренда аккаунта,
        сохранения).

        `ack.ok = false` + `ack.error` бывает только для ошибок уровня команды: `validation` (нет payload),
        `internal` (непредвиденное исключение, неизвестная форма payload), `timeout` (команда истекла по `expiresAt`,
        5 мин на агенте, вытеснена по REST-пути), `conflict` + `details.reason = superseded` (вытеснена по WS).

        При `result.ok = true` всегда есть `pid`; при `result.ok = false` всегда есть `error`, `pid` отсутствует.
