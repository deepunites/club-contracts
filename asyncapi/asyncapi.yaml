      name: ack.lock
      title: Ack команды lock
      summary: Результат — нет (ack.result отсутствует).
      tags:
        - $ref: '#/components/tags/ack'
      correlationId:
        $ref: '#/components/correlationIds/ackCommandId'
      payload:
        allOf:
          - $ref: '#/components/schemas/WsAckFrame'
          - type: object
            properties:
              ack:
                properties:
                  result:
                    type: 'null'
      examples:
