components:
  tags:
    command:
      name: command
      description: Команда сервер → агент; агент отвечает кадром ack.
    ack:
      name: ack
      description: Подтверждение команды агент → сервер.
    event:
      name: event
      description: Событие агент → сервер; без подтверждения.
    push:
      name: push
      description: Уведомление сервер → агент; без подтверждения.
    keepalive:
      name: keepalive
      description: Кадры ping/pong.

  securitySchemes:
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        `Authorization: Bearer <JWT агента>` в запросе рукопожатия (тот же accessToken, что для REST). Агент шлёт всегда;
        агент с club-shell `feat/shell-changes` — только так. Предпочтительный способ для сервера.
      x-source:
        - src/ClubShell.Core/Realtime/RealtimeClient.cs:108
    agentTokenQuery:
      type: httpApiKey
      in: query
      name: token
      description: >-
        Query `token=<JWT агента>` — для совместимости со старыми агентами, которые шлют его вместе с заголовком. Агент
        с club-shell `feat/shell-changes` query не шлёт; мок принимает оба способа.
      x-note: >-
        Риск утечки токена: URL с `token` пишется в access-логи reverse-proxy, балансировщика и веб-сервера, в
        трассировки и метрики по URL. Маскировать `token` в логах всех звеньев (или не логировать query у `/ws/agent`),
        серверу предпочитать заголовок `Authorization`, а query оставить только для совместимости.
      x-source:
        - tools/MockServer/src/ws.ts:248
        - docs/SERVER_API.md:492

  correlationIds:
    commandId:
      description: '`id` кадра command = id команды; ответный ack несёт его в `ack.id`.'
      location: '$message.payload#/id'
    ackCommandId:
      description: '`ack.id` = id подтверждаемой команды (сам кадр ack имеет свой случайный `id`).'
      location: '$message.payload#/ack/id'
    pingId:
      description: '`id` кадра ping; pong повторяет его в своём `id`.'
      location: '$message.payload#/id'

  schemas:
    WsCommandFrame:
      description: Кадр command (сервер → агент). Требует ack; `name` — ServerCommandType.
      allOf:
        - $ref: '../openapi/openapi.yaml#/components/schemas/WsFrame'
        - type: object
          required:
            - type
            - id
            - ts
            - name
            - payload
          properties:
            type:
              const: command
            id:
              description: Id команды (ключ дедупликации агента и ack.id).
            name:
              $ref: '../openapi/openapi.yaml#/components/schemas/ServerCommandType'
            supersedes:
              description: Id более ранней команды, выполнение которой агент должен отменить.
            expiresAt:
              description: После этого времени (по часам агента) команда не выполняется, ack { ok = false, error.code = timeout }.
      x-csharp: src/ClubShell.Contracts/Commands/ServerCommand.cs:642
      x-note: Сужение WsFrame по `type`; отдельного C#-типа нет. Первая ссылка в x-source — фабричный метод/разбор кадра этого типа.
      x-source:
        - src/ClubShell.Contracts/Commands/ServerCommand.cs:180
        - src/ClubShell.Core/Realtime/RealtimeClient.cs:361
        - tools/MockServer/src/ws.ts:137
    WsAckFrame:
      description: |
        Кадр ack (агент → сервер). `id` кадра случаен, `ack.id` — id команды, `payload` = null. При `ok = false` есть
        `error`; результат — по типу команды (сужается в сообщениях ack*). Ack на команду с неизвестным `name` приходит
        с `error.code = notFound`. `ok = true` означает, что команда обработана, но не всегда — что действие удалось:
        у `launchGame` смотреть `result.ok`, у `update` — `result.scheduled` (info §7).
      allOf:
        - $ref: '../openapi/openapi.yaml#/components/schemas/WsFrame'
        - type: object
          required:
            - type
            - id
            - ts
            - payload
            - ack
          properties:
            type:
              const: ack
            payload:
              type: 'null'
            ack:
              allOf:
                - $ref: '../openapi/openapi.yaml#/components/schemas/WsAck'
                - if:
                    required:
                      - ok
                    properties:
                      ok:
                        const: false
                  then:
                    required:
                      - error
                    properties:
                      error:
                        $ref: '../openapi/openapi.yaml#/components/schemas/IpcError'
      x-csharp: src/ClubShell.Contracts/Commands/ServerCommand.cs:642
      x-note: Сужение WsFrame по `type`; отдельного C#-типа нет. Первая ссылка в x-source — фабричный метод/разбор кадра этого типа.
      x-source:
        - src/ClubShell.Contracts/Commands/ServerCommand.cs:659
        - src/ClubShell.Core/Realtime/RealtimeClient.cs:461
        - tools/MockServer/src/ws.ts:214
    WsEventFrame:
      description: Кадр event (агент → сервер). Без подтверждения; `name` — AgentEventType; `ts` — время отправки.
      allOf:
        - $ref: '../openapi/openapi.yaml#/components/schemas/WsFrame'
        - type: object
          required:
            - type
            - id
            - ts
            - name
            - payload
          properties:
            type:
              const: event
            name:
              $ref: '../openapi/openapi.yaml#/components/schemas/AgentEventType'
      x-csharp: src/ClubShell.Contracts/Commands/ServerCommand.cs:642
      x-note: Сужение WsFrame по `type`; отдельного C#-типа нет. Первая ссылка в x-source — фабричный метод/разбор кадра этого типа.
      x-source:
        - src/ClubShell.Contracts/Commands/ServerCommand.cs:663
        - src/ClubShell.Core/Realtime/RealtimeClient.cs:204
        - tools/MockServer/src/ws.ts:221
    WsPushFrame:
      description: Кадр push (сервер → агент). Без подтверждения; `name` — WsPushKind; `supersedes`/`expiresAt` не используются.
      allOf:
        - $ref: '../openapi/openapi.yaml#/components/schemas/WsFrame'
        - type: object
          required:
            - type
            - id
            - ts
            - name
            - payload
          properties:
            type:
              const: push
            name:
              $ref: '../openapi/openapi.yaml#/components/schemas/WsPushKind'
      x-csharp: src/ClubShell.Contracts/Commands/ServerCommand.cs:642
      x-note: Сужение WsFrame по `type`; отдельного C#-типа нет. Первая ссылка в x-source — фабричный метод/разбор кадра этого типа.
      x-source:
        - src/ClubShell.Contracts/Commands/ServerCommand.cs:680
        - src/ClubShell.Agent/Server/ServerConnection.cs:368
        - tools/MockServer/src/ws.ts:88
    WsPingFrame:
      description: Кадр ping. `payload` = null, `name` отсутствует.
      allOf:
        - $ref: '../openapi/openapi.yaml#/components/schemas/WsFrame'
        - type: object
          required:
            - type
            - id
            - ts
            - payload
          properties:
            type:
              const: ping
            payload:
              type: 'null'
      x-csharp: src/ClubShell.Contracts/Commands/ServerCommand.cs:642
      x-note: Сужение WsFrame по `type`; отдельного C#-типа нет. Первая ссылка в x-source — фабричный метод/разбор кадра этого типа.
      x-source:
        - src/ClubShell.Contracts/Commands/ServerCommand.cs:677
        - tools/MockServer/src/ws.ts:232
    WsPongFrame:
      description: Кадр pong. `id` = id ping, на который это ответ; `payload` = null.
      allOf:
        - $ref: '../openapi/openapi.yaml#/components/schemas/WsFrame'
        - type: object
          required:
            - type
            - id
            - ts
            - payload
          properties:
            type:
              const: pong
            payload:
              type: 'null'
      x-csharp: src/ClubShell.Contracts/Commands/ServerCommand.cs:642
      x-note: Сужение WsFrame по `type`; отдельного C#-типа нет. Первая ссылка в x-source — фабричный метод/разбор кадра этого типа.
      x-source:
        - src/ClubShell.Contracts/Commands/ServerCommand.cs:670
        - src/ClubShell.Core/Realtime/RealtimeClient.cs:340
        - tools/MockServer/src/ws.ts:205

  messages:
    # ==== Команды и ack ===============================================================================================
    commandLock:
      name: command.lock
      title: Команда lock
      summary: Заблокировать сессию (если открыта) или показать экран простоя; IPC shell.command{lock}.
      description: Payload необязателен (null/отсутствует — все поля пустые). Результат ack — нет.
      tags:
        - $ref: '#/components/tags/command'
      correlationId:
        $ref: '#/components/correlationIds/commandId'
      payload:
        allOf:
          - $ref: '#/components/schemas/WsCommandFrame'
          - type: object
            properties:
              name:
                const: lock
              payload:
                oneOf:
                  - $ref: '../openapi/openapi.yaml#/components/schemas/LockCommand'
                  - type: 'null'
      examples:
        - name: lockByStaff
          summary: Блокировка с кассы
          payload:
            type: command
            id: c0a8f5e2-1d3b-4c5a-9e7f-0a1b2c3d4e5f
            ts: '2026-09-21T10:20:00.000Z'
            name: lock
            payload:
              reason: staff
              message: Подойдите к стойке администратора
            expiresAt: '2026-09-21T10:25:00.000Z'
      x-source:
        - src/ClubShell.Contracts/Commands/ServerCommand.cs:91
        - src/ClubShell.Contracts/Commands/ServerCommand.cs:264
        - src/ClubShell.Agent/Server/CommandReceiver.cs:271
        - docs/SERVER_API.md:516
        - tools/MockServer/src/routes/admin.ts:255
