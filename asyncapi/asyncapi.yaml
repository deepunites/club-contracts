    bindings:
      ws:
        method: GET
        query:
          type: object
          description: >-
            Query рукопожатия. Старые агенты добавляют `token` к query, уже заданной в `server.wsUrl`; агент с club-shell
            `feat/shell-changes` query не меняет.
          properties:
            token:
              type: string
              deprecated: true
              description: >-
                JWT агента (тот же accessToken, что в `Authorization`). Обязателен, если нет заголовка `Authorization`.
                Шлют только старые агенты; агент с club-shell `feat/shell-changes` — нет (SHELL_CHANGES п. 6).
              x-note: >-
                Риск: токен в URL попадает в access-логи reverse-proxy/балансировщика/сервера и в метрики URL. На
                прокси и сервере маскировать параметр `token` в логах (или не логировать query у `/ws/agent`),
                предпочитать заголовок `Authorization`. На WS подписи нет, поэтому утёкший JWT (≈ 1 ч) позволяет
                подключиться от имени ПК: получать команды и пользовательские push, слать ack и события. Для REST
                нужен ещё `signingSecret`.
              x-source:
                - src/ClubShell.Core/Realtime/RealtimeClient.cs:267
                - tools/MockServer/src/ws.ts:248
                - docs/SERVER_API.md:492
        headers:
          type: object
          description: Заголовки рукопожатия, которые шлёт агент.
          required:
            - Sec-WebSocket-Protocol
          properties:
            Sec-WebSocket-Protocol:
              type: string
              const: clubshell.v1
              description: Сабпротокол; сервер обязан выбрать и вернуть `clubshell.v1`, иначе (предложен только другой) — закрыть 4426.
              x-source:
                - src/ClubShell.Core/Realtime/RealtimeClient.cs:110
                - src/ClubShell.Contracts/Commands/ServerCommand.cs:656
                - tools/MockServer/src/ws.ts:254
            Authorization:
              type: string
              pattern: '^Bearer \S+$'
              description: >-
                `Bearer <JWT агента>`; агент шлёт всегда. Агент с club-shell `feat/shell-changes` — единственный способ
                передать токен; старые агенты дублируют тот же JWT в query `token`.
              x-note: >-
                Решение сервера: заголовок приоритетнее query `token`; если заданы оба и они различаются — закрыть 4401.
                Мок с club-shell feat/shell-changes читает заголовок, а без него — query `token`
                (tools/MockServer/src/ws.ts:248); SERVER_API.md §6 и SECURITY.md этой ветки описывают заголовок.
              x-source:
                - src/ClubShell.Core/Realtime/RealtimeClient.cs:108
                - tools/MockServer/src/ws.ts:248
        bindingVersion: 0.1.0
    x-close-codes:
      - code: 4401
        sender: server
        when: Токен агента неверен, истёк или отозван (при подключении или в любой момент позже).
        agent: >-
          ServerApiException(unauthorized) → POST /agents/refresh, при 401/403 — POST /agents/register → переподключение
          через 1 с (без роста задержки). Агент с club-shell feat/shell-changes обновляет токен за 2 мин до exp и сам
          переподключается, так что закрытие 4401 по exp его обычно не застаёт.
        x-source:
          - src/ClubShell.Core/Realtime/RealtimeClient.cs:41
          - src/ClubShell.Core/Realtime/RealtimeClient.cs:232
          - src/ClubShell.Agent/Server/ServerConnection.cs:55
          - src/ClubShell.Agent/Server/ServerConnection.cs:282
          - tools/MockServer/src/ws.ts:251
          - tools/MockServer/src/ws.ts:361
      - code: 4426
        sender: server
        when: Неподдерживаемый сабпротокол или версия протокола.
        agent: >-
          ServerApiException(versionMismatch) → переподключение через 1 с без роста задержки (соединение уже было
          установлено, счётчик попыток обнулён); попытки не прекращаются. Отказывать по версии лучше HTTP 426 на
          рукопожатии — тогда действует экспоненциальный backoff.
        x-source:
          - src/ClubShell.Core/Realtime/RealtimeClient.cs:44
          - src/ClubShell.Core/Realtime/RealtimeClient.cs:240
          - src/ClubShell.Core/Realtime/RealtimeClient.cs:140
          - src/ClubShell.Agent/Server/ServerConnection.cs:282
          - src/ClubShell.Core/Realtime/Reconnector.cs:201
          - tools/MockServer/src/ws.ts:255
      - code: 1000
        sender: server | agent
        when: Сервер — соединение вытеснено новым соединением того же ПК; агент — штатное закрытие.
        agent: Переподключение через 1 с.
        x-source:
          - tools/MockServer/src/ws.ts:261
          - src/ClubShell.Core/Realtime/RealtimeClient.cs:256
      - code: 1001
        sender: server
        when: Остановка сервера.
        agent: Переподключение через 1 с без роста задержки (соединение уже было установлено); далее, если сервер не отвечает на рукопожатие, — экспоненциальный backoff.
        x-source:
          - tools/MockServer/src/ws.ts:299
          - src/ClubShell.Core/Realtime/Reconnector.cs:201
      - code: 1009
        sender: server
        when: Кадр больше 1 МиБ.
        agent: Переподключение через 1 с без роста задержки (соединение уже было установлено).
        x-source:
          - tools/MockServer/src/ws.ts:276
          - src/ClubShell.Core/Realtime/Reconnector.cs:201
    x-limits:
      maxFrameBytes: 1048576
      serverPingIntervalSec: 20
      pongTimeoutSec: 10
      agentReceiveIdleTimeoutSec: 75
      agentWsKeepAliveIntervalSec: 30
      agentOutboundBufferFrames: 1024
      agentCommandTimeoutSec: 300
