asyncapi: 3.0.0
info:
  title: Club agent WebSocket
  version: 1.0.0
  description: |
    WebSocket-канал между сервером клуба (это приложение, `application`) и агентом на ПК клуба
    (`club-shell/src/ClubShell.Core/Realtime/RealtimeClient.cs`). Все направления описаны с точки зрения сервера:
    `send` — сервер отправляет агенту, `receive` — сервер принимает от агента.
    Источник формы данных — код агента (C# `ClubShell.Contracts` > MockServer > `docs/SERVER_API.md` §6).
    Схемы payload не дублируются: они берутся из собранного REST-контракта `../openapi/openapi.yaml`
    (имена = имена C#-типов). Сериализация — как в REST-контракте (openapi `info.description` §1): camelCase,
    enum — camelCase-строки, `null` агент опускает (кроме ключа `payload` кадра и `details` в `IpcError` — они
    пишутся всегда), время `yyyy-MM-ddTHH:mm:ss.fffZ`, UUID строчными.

    ## 1. Подключение

    - Адрес: `wss://{host}/ws/agent` — НЕ под `/api/v1`. Агент берёт его из `agent.json → server.wsUrl` (по умолчанию
      `wss://club.example.uz/ws/agent`) или из `AgentServerConfig.wsUrl` ответа `GET /agents/{pcId}/config`;
      допускаются схемы `wss` и `ws` (`ws` — только для мока/разработки).
    - Рукопожатие: `GET` с `Sec-WebSocket-Protocol: clubshell.v1` и `Authorization: Bearer <JWT агента>`. Query
      `token=<тот же JWT>` шлют только старые агенты (вместе с заголовком); агент с club-shell `feat/shell-changes`
      токен в URL не кладёт (см. §2).
    - Одно соединение на ПК: новое соединение того же `pcId` вытесняет старое (мок закрывает старое кодом 1000).
      Факт подключения сервер может использовать как признак «ПК онлайн» (мок переводит `offline` → `free`).
    - Сразу после подключения сервер переотправляет все неподтверждённые и неистёкшие команды ПК (старые первыми).
    - Для агента состояние «онлайн» = открытое WS-соединение (`ServerConnection.IsOnline`): без WS агент считает себя
      офлайн, не сбрасывает outbox, не сверяет сессию и отвечает шеллу `agentOffline` на онлайн-операции.

    ## 2. Аутентификация

    - JWT агента (тот же `accessToken`, что для REST; RS256, `exp` ≈ 1 ч). Подпись HMAC (`X-Timestamp`/`X-Signature`)
      на WS НЕ используется.
    - Агент с club-shell `feat/shell-changes` (SHELL_CHANGES п. 6) передаёт токен только в заголовке
      `Authorization: Bearer` (`RealtimeClient.cs:108`): JWT в URL попадал в access-логи прокси. Старые агенты шлют
      тот же JWT и в заголовке, и в query `token`. Сервер принимает любой из двух способов; мок с этой ветки — тоже
      (заголовок, иначе `?token=`, `ws.ts:248`). Заголовок приоритетнее query; если заданы оба и они различаются —
      закрыть 4401 (решение сервера; ни один агент такой ситуации не создаёт).
    - Токен проверяется при рукопожатии. Неверный/истёкший/отозванный токен — либо HTTP 401/403 на рукопожатии,
      либо принять апгрейд и закрыть кодом 4401 (так делает мок). Агент обрабатывает оба варианта одинаково:
      `POST /agents/refresh` (при отказе — `POST /agents/register`) и переподключение.
    - Агент с club-shell `feat/shell-changes` обновляет токен за 2 мин до `exp` и переподключает сокет с новым
      токеном (`ServerConnection.RefreshBeforeExpiryAsync`) — при TTL 1 ч это одно переподключение в час, шелл может
      увидеть короткое «офлайн/онлайн». Поэтому сервер может закрывать соединение кодом 4401 по `exp` токена. Старые
      агенты после обновления токена сами не переподключаются: их соединение живёт дольше `exp` до закрытия 4401
      (восстановление штатное). При отзыве ПК/токенов сервер закрывает соединение кодом 4401 (мок:
      `POST /mock/reset-tokens`).

    ## 3. Сабпротокол `clubshell.v1`

    Агент всегда предлагает `clubshell.v1`; сервер обязан выбрать его и вернуть
    `Sec-WebSocket-Protocol: clubshell.v1`. Если клиент предложил только другие сабпротоколы — закрыть 4426
    (мок). Агент .NET не падает, если сервер не вернул заголовок, но падает, если сервер выбрал другой сабпротокол.

    ## 4. Коды закрытия

    | Код | Когда (сервер) | Реакция агента |
    |-----|----------------|----------------|
    | 4401 | токен неверен, истёк или отозван (при подключении или позже) | refresh/повторная регистрация, переподключение через 1 с |
    | 4426 | неподдерживаемый сабпротокол/версия протокола | `versionMismatch` в логе, переподключение через 1 с (попытки не прекращаются, задержка не растёт) |
    | 1000 | соединение вытеснено новым соединением того же ПК (мок) | переподключение через 1 с |
    | 1001 | остановка сервера | переподключение через 1 с |
    | 1009 | кадр больше 1 МиБ (мок) | переподключение через 1 с |

    Все коды закрытия приходят ПОСЛЕ успешного апгрейда: агент уже вызвал `Reconnector.MarkConnected`
    (`RealtimeClient.cs:140` → `ServerConnection.cs:282`), поэтому счётчик попыток обнуляется и следующая задержка —
    ровно `MinDelay` = 1 с (`Reconnector.cs:201-207`, `ComputeDelay(attempt = 1)`). Экспоненциального роста при
    повторяющихся закрытиях установленного соединения НЕТ: сервер, который закрывает 4426/1009/4401 сразу после
    апгрейда, будет получать переподключение от каждого ПК раз в секунду. То же после тайм-аута простоя (§6) и
    слишком большого входящего кадра.

    Экспоненциальный backoff действует только при отказе на этапе рукопожатия (HTTP-статус вместо 101 или сетевая
    ошибка): равномерно случайная задержка в `[1 с, min(60 с, 1 с · 2^(n−1))]` (`Reconnector.ComputeDelay`), попытки
    бесконечны. HTTP 401/403 на рукопожатии агент трактует как 4401 (refresh, затем backoff); прочие HTTP-статусы
    рукопожатия (404, 426, 5xx) — как сетевую ошибку. Поэтому отказывать по версии/сабпротоколу и при перегрузке
    лучше HTTP-статусом на рукопожатии (426 / 503), а не кодом закрытия после апгрейда.

    ## 5. Кадры

    - Только текстовые кадры, один JSON `WsFrame` на кадр, не больше 1 048 576 байт в обе стороны. Бинарные кадры
      агент игнорирует. Входящий кадр > 1 МиБ агент считает ошибкой и рвёт соединение; исходящий > 1 МиБ молча
      отбрасывает (в т.ч. ack — поэтому результат ack должен быть небольшим).
    - Кадр с невалидным JSON или неизвестным `type` агент отбрасывает целиком (лог). Входящие от сервера
      `ack`/`event`/`pong` агент игнорирует.
    - Поля: `type`, `id`, `ts` обязательны; ключ `payload` сервер пишет всегда (`null`, если тела нет) — агент
      пишет его всегда; `name` — для `command`/`event`/`push`; `ack` — для `ack`; `supersedes`/`expiresAt` — только
      у `command`. `issuedBy` в WS-кадре нет (есть только в REST-конверте `ServerCommandEnvelope`).
    - `ts` — часы отправителя; у кадров агента это часы ПК (могут расходиться с сервером).

    ## 6. Keepalive

    - Сервер шлёт кадр `ping` (WsFrame, текстовый кадр) каждые 20 с и ждёт `pong` с тем же `id` 10 с; нет ответа —
      рвёт соединение (мок: `terminate`). Пока ждёт `pong`, новый `ping` не шлёт.
    - Агент отвечает `pong` немедленно. Если агент 75 с не получил ни одного кадра данных (текстового или бинарного;
      таймер создаётся заново на каждое сообщение, `RealtimeClient.cs:279`, бинарный кадр тоже его сбрасывает —
      `:308-312`), он считает соединение мёртвым и переподключается. Управляющие кадры WebSocket (opcode Ping/Pong)
      этот таймер НЕ сбрасывают. `ping` сервер обязан слать именно как WsFrame в текстовом кадре (бинарные кадры агент
      не обрабатывает и `pong` на них не отвечает); интервал — меньше 75 с.
    - Агент дополнительно каждые 30 с шлёт управляющий кадр WebSocket Pong без запроса (.NET 8
      `ClientWebSocket.KeepAliveInterval`, RFC 6455 §5.5.3 — односторонний heartbeat). Сервер не должен считать
      это ошибкой.

    ## 7. Команды сервер → агент

    - Доставка at-least-once. Сервер хранит команду в очереди ПК до первого ack или до `expiresAt`; подключённому
      ПК шлёт сразу, при подключении переотправляет неподтверждённые. Истёкшие команды сервер не отправляет.
    - Та же очередь доступна по REST: `heartbeat.pendingCommands` = число неподтверждённых неистёкших команд
      (включая уже отправленные по WS, но ещё без ack); при > 0 агент забирает их `GET /agents/{pcId}/commands` и
      подтверждает `POST /agents/{pcId}/commands/{commandId}/ack` — даже при живом WS. Поэтому одна команда может
      прийти обоими путями: агент выполнит её один раз, но ack может прийти дважды (WS и REST). Сервер принимает
      повторные ack идемпотентно (последний перезаписывает; у `message` второй ack по REST несёт `ackedAt`).
    - Дедупликация на агенте — по `id` команды (24 ч, до 1024 записей в памяти, `CommandReceiver`). Агент с club-shell
      `feat/shell-changes` (SHELL_CHANGES п. 6) на повтор команды по WS и по REST отвечает ack первого выполнения (у
      ещё выполняемой команды — когда она завершится), а ack выполненных `reboot`/`shutdown` хранит 24 ч на диске
      (`cache/power-acks.json`): команда, повторно доставленная после вызванной ею перезагрузки, получает прежний ack
      и ПК снова не перезагружает. Прочие команды после перезапуска агента выполняются повторно. Старые агенты повтор
      по WS молча игнорировали без ack и хранили всё только в памяти. Поэтому команды с побочным эффектом (`reboot`,
      `shutdown`, `update`, `launchGame`) сервер по-прежнему отправляет с `expiresAt`.
    - `expiresAt`: агент сравнивает со своими часами; просроченную команду не выполняет и отвечает
      `ack { ok: false, error.code: timeout }`. Запас `expiresAt` — не меньше допустимого расхождения часов.
    - `supersedes`: агент отменяет выполняемую (in-flight) более раннюю команду с этим id; отменённая получает
      `ack { ok: false, error: { code: conflict, details.reason: superseded } }` (по WS) или `timeout` (по REST-пути).
      Ещё не доставленную вытесненную команду сервер сам убирает из очереди (агент о ней не знает).
    - Выполнение параллельное: агент не ждёт завершения предыдущей команды, ack приходят в порядке завершения, а не
      отправки. Зависимые команды (например, `lock` → `unlock`) сервер отправляет после ack предыдущей или через
      `supersedes`. Тайм-аут выполнения одной команды на агенте — 5 мин (затем `ack` с `timeout`).
    - Ack: кадр `ack`, `ack.id` = id команды, `ack.ok`; при `ok = false` — `ack.error` (`IpcError`); при `ok = true` —
      `ack.result` по типу команды (у команд без результата поле отсутствует). Коды ошибок, которые ставит сам агент:
      `notFound` (неизвестное имя команды — ack всё равно приходит; чужой `sessionId`), `validation` (нет
      обязательного payload, невалидная политика), `timeout` (истекла / 5 мин / вытеснена по REST-пути),
      `conflict` + `details.reason = superseded`, `policyDenied` (запрещено локальными настройками агента),
      `serverUnavailable` (WoL/релей недоступны), `sessionNotActive`, `internal` (`details.traceId` = id команды);
      плюс коды, проброшенные из REST-вызовов, которые агент делает при выполнении (например, `insufficientFunds`).
    - ВНИМАНИЕ: `ack.ok = true` не всегда значит «действие выполнено». У `launchGame` провал запуска приходит как
      `ack.ok = true` + `ack.result.ok = false` + `ack.result.error` (см. `ackLaunchGame`); у `update` сбой
      скачивания/проверки/подготовки/применения — как `ack.ok = true` + `ack.result.scheduled = false` (см. `ackUpdate`).
      Сервер обязан смотреть и на `ack.result`.
    - Payload неизвестной формы (новые значения enum и т.п.) агент не десериализует — ack `internal`.

    ## 8. События агент → сервер

    Без подтверждения и без повторов (fire-and-forget). Если WS не подключён или буфер (1024 кадра) полон, событие
    теряется — оно НЕ копится в outbox (SERVER_API.md §6.2 с club-shell `feat/shell-changes` говорит так же); данные
    доходят через REST-аналоги (`/sessions/{id}/events`, `/games/{id}/launch-report` — с этой ветки тоже через
    офлайн-очередь агента, `/agents/{pcId}/telemetry`, `/anticheat/report`). Сейчас агент реально шлёт только
    `anticheatViolation`, `hardwareChanged`, `offlineQueueFlushed` (`x-agent-emits`). `ts` кадра — время отправки;
    время события — в payload, где оно есть. `id` кадра случаен — сервер может дедуплицировать по нему.

    ## 9. Push сервер → агент

    Без ack и без повторов (at-most-once); сервер не копит push для офлайн-ПК — агент сам сверяет состояние по REST
    после переподключения. Адресация (мок): пользовательские push — на все ПК, где у пользователя действующий
    `X-User-Token`; `pcStatusChanged` — всем подключённым ПК; `chatMessage` — по комнате (`club` — всем, `zone:<z>` —
    ПК зоны, `pc:<id>` — этому ПК, `dm:<a>:<b>` — ПК участников, кроме отправителя). Неизвестный `name` агент
    игнорирует.

    ## 10. Совместимость

    Добавлять поля в payload можно всегда. Новые имена команд безопасны (агент ответит `notFound`; с club-shell
    `feat/shell-changes` — и в REST-пачке `GET /agents/{pcId}/commands`), новые имена push и событий — тоже
    (игнорируются). Новый `type` кадра и новые значения enum внутри payload агент с этой ветки читает как `unknown`
    у enum с `x-agent-fallback` (openapi `info.description` §9): кадр неизвестного типа игнорирует, а значение
    `unknown` в payload обрабатывает сам (например, отклоняет `update` с неизвестным компонентом). У старых агентов
    и у прочих enum — только согласованно с релизом агента (`x-enum-added`).
