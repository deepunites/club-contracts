defaultContentType: application/json

servers:
  production:
    host: '{host}'
    protocol: wss
    title: Сервер клуба
    description: Центральный сервер клуба. Тот же хост, что у REST (`https://{host}/api/v1`), но путь WS — `/ws/agent` без `/api/v1`.
    variables:
      host:
        default: club.example.uz
        description: Хост (и при необходимости порт) сервера клуба.
    security:
      - $ref: '#/components/securitySchemes/agentBearer'
      - $ref: '#/components/securitySchemes/agentTokenQuery'
  mock:
    host: 'localhost:8080'
    protocol: ws
    title: MockServer
    description: Мок из `club-shell/tools/MockServer` (только разработка; `MOCK_SERVER_PORT`, по умолчанию 8080).
    security:
      - $ref: '#/components/securitySchemes/agentBearer'
      - $ref: '#/components/securitySchemes/agentTokenQuery'

channels:
  agent:
    address: /ws/agent
    title: Канал агента
    summary: Двунаправленный канал сервер ↔ агент ПК (кадры WsFrame, сабпротокол clubshell.v1).
    description: |
      Одно соединение на ПК. Кадры: `command` (сервер → агент, требует `ack`), `ack` (агент → сервер), `event`
      (агент → сервер, без подтверждения), `push` (сервер → агент, без подтверждения), `ping`/`pong` (keepalive).
      Общая форма кадра — `WsFrame` (`../openapi/openapi.yaml#/components/schemas/WsFrame`); сообщения ниже сужают
      её по `type` и `name`. Коды закрытия — `x-close-codes`, лимиты — `x-limits`.
    servers:
      - $ref: '#/servers/production'
      - $ref: '#/servers/mock'
