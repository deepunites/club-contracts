    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        То же, что `IdempotencyKey`, но необязательный: клиент может ключ не прислать, и тогда идемпотентности нет.
        Касса `apps/admin` с club-shell `feat/shell-changes` шлёт его на семи денежных маршрутах (`POST /admin/sessions`,
        `/admin/sessions/extend`, `/admin/sessions/end`, `/admin/wallet/topup`, `/admin/promo/redeem`,
        `/admin/products/{id}/receive`, `/admin/shift/close`): один UUID v4 на действие кассира, тот же при повторе того
        же тела после сетевой ошибки или 5xx (описание API, §5). Старые сборки кассы и агент на других POST ключ не шлют.
      schema:
        type: string
        format: uuid
      x-source:
        - docs/SERVER_API.md:20
        - apps/admin/src/api.ts:118
        - apps/admin/src/api.ts:142
        - tools/MockServer/src/routes/admin.ts:9
