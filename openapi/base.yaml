servers:
  - url: 'https://{host}/api/v1'
    description: Центральный сервер клуба (`agent.json → server.baseUrl` включает `/api/v1`).
    variables:
      host:
        default: club.example.uz
        description: Хост (и при необходимости порт) сервера клуба.
tags:
  - name: agents
    description: Регистрация агента, токены, heartbeat, телеметрия, конфигурация, политики, REST-фолбэк команд.
  - name: pcs
    description: ПК клуба (карта мест, «друзья»).
  - name: auth
    description: Вход и выход пользователя на ПК (пароль, карта, токен, QR, гость).
  - name: users
    description: Профиль пользователя, статистика, достижения, лояльность.
  - name: sessions
    description: Игровые сессии — старт, пауза, продление, завершение, события.
  - name: games
    description: Каталог игр, пул аккаунтов лаунчеров, облачные сохранения, отчёты о запуске.
  - name: apps
    description: Каталог приложений.
  - name: wallet
    description: Баланс, история операций, тарифы, пополнение.
  - name: shop
    description: Товары и заказы бара.
  - name: chat
    description: Чат клуба (ПК, зона, клуб, личные сообщения).
  - name: booking
    description: Бронирование мест.
  - name: tournaments
    description: Турниры и таблицы лидеров.
  - name: updates
    description: Манифесты обновлений агента и шелла.
  - name: support
    description: Вызов администратора.
  - name: anticheat
    description: Отчёты античита.
  - name: admin
    description: Касса и настройка клуба (`apps/admin`, маршруты `/admin/*`), вход персонала по PIN.
paths: {}
components:
  securitySchemes:
    clubKey:
      type: apiKey
      in: header
      name: X-Club-Key
      description: |
        Ключ API клуба (`agent.json → server.clubApiKey`). Используется только для `POST /agents/register`.
        Отсутствует/неверен — `401 unauthorized`, `details.reason = "clubKey"`.
      x-source:
        - docs/SERVER_API.md:36
        - src/ClubShell.Core/Http/ServerClient.cs:813
        - tools/MockServer/src/routes/pcs.ts:104
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access-токен агента (JWT RS256, `exp` ≈ 1 ч; claims `sub` = pcId, `club`, `hwid`, `role = "agent"`, `iat`, `exp`,
        `jti`), из `POST /agents/register` / `POST /agents/refresh`. На маршрутах `/api/v1/*` — всегда вместе с подписью
        `X-Timestamp` + `X-Signature` (см. описание API, §3); без подписи — только при скачивании пакета обновления по
        `UpdateManifest.url` (с `Range`). Истёк — `401`, `details.reason = "expired"`; неизвестен — `invalid`; ПК удалён —
        `revoked`.
      x-source:
        - docs/SERVER_API.md:37
        - docs/SERVER_API.md:44
        - src/ClubShell.Core/Http/ServerClient.cs:822
        - tools/MockServer/src/db.ts:702
        - tools/MockServer/src/db.ts:736
        - src/ClubShell.Core/Updates/UpdateDownloader.cs:248
        - docs/SERVER_API.md:395
    publishToken:
      type: http
      scheme: bearer
      description: |
        Токен публикации релизов шелла (`-Token` / `CLUBSHELL_PUBLISH_TOKEN` скрипта `publish.ps1`, цель `Http`).
        Выдаётся издателю, не агенту; подписи `X-Timestamp`/`X-Signature` нет. Используется для `POST` и проверочного
        `GET /updates/{channel}/manifest`, а также для загрузки пакетов `PUT <base>/<channel>/<version>/<file>` вне
        `/api/v1` (см. `x-note` на пути манифеста).
      x-source:
        - tools/scripts/publish.ps1:16
        - tools/scripts/publish.ps1:191
        - tools/scripts/publish.ps1:236
        - tools/scripts/publish.ps1:345
    userToken:
      type: apiKey
      in: header
      name: X-User-Token
      description: |
        Access-токен пользователя (непрозрачный) из `POST /auth/login`, `/auth/guest` или `GET /auth/qr/{token}`.
        Сервер проверяет, что токен принадлежит пользователю, привязанному к pcId из токена агента. Передаётся только
        вместе с `agentBearer` и подписью и только когда пользователь вошёл (`ServerClient.Authorize`).
        Для операций, где пользователь обязателен, отсутствует/недействителен — `401`, `details.reason = "userToken"`,
        `details.problem` ∈ `invalid` | `expired` | `boundElsewhere` | `revoked` (мок). Для операций, где токен только
        обогащает ответ (`GET /games`, `GET /games/{id}`, `POST /sessions/{id}/end`, `GET /tournaments`,
        `GET /tournaments/{id}/leaderboard`, `POST /support/call-admin`), он необязателен: без него (или с
        недействительным) — обычный ответ без обогащения, `401` недопустим; security —
        `[{agentBearer: [], userToken: []}, {agentBearer: []}]` (см. описание API, §2).
      x-source:
        - docs/SERVER_API.md:78
        - src/ClubShell.Core/Http/ServerClient.cs:834
        - tools/MockServer/src/db.ts:446
        - tools/MockServer/src/db.ts:744
        - tools/MockServer/src/db.ts:456
        - tools/MockServer/src/routes/games.ts:62
        - docs/SERVER_API.md:291
    staffBearer:
      type: http
      scheme: bearer
      description: |
        Токен персонала кассы (непрозрачный, в моке `st_<hex>`), выдаётся `POST /admin/login` по PIN; касса хранит его в
        localStorage и шлёт как `Authorization: Bearer <token>`. Подписи нет. Неверный — `401`, `details.reason = "invalid"`
        (касса на 401 выходит из учётной записи); не хватает роли — `403`, `details.reason = "ownerOnly"`.
        Кнопка «Выйти» кассы вызывает `POST /admin/logout`: токен отзывается, дальнейшие запросы с ним — `401 invalid`.
      x-source:
        - apps/admin/src/api.ts:89
        - apps/admin/src/api.ts:582
        - tools/MockServer/src/routes/club.ts:63
        - tools/MockServer/src/routes/club.ts:136
        - tools/MockServer/src/routes/club.ts:175
  parameters:
    XTimestamp:
      name: X-Timestamp
      in: header
      required: true
      description: |
        Unix-время в секундах (десятичная строка) по часам агента с учётом выученного смещения сервера. Входит в подпись.
        Вне окна ±300 с — `401`, `details.reason = "clockSkew"` + `X-Server-Time`.
      schema:
        type: string
        pattern: '^[0-9]{1,19}$'
      example: '1789992930'
