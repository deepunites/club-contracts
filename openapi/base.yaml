    NotImplemented:
      description: |
        Операция есть в контракте, но сервер v1 её не реализует (`x-server-status: notImplemented`), в том числе всё,
        связанное с Telegram (`x-prohibited: telegram`).

        `Retry-After` на 501 не отправлять.

        Код ошибки — `notImplemented` (добавлен в `ErrorCode` по SHELL_CHANGES п. 1, см. `ErrorCode.x-enum-added`),
        `details` — `null` или `{ reason: "notImplemented" }`. Старый агент неизвестный код не распарсит, отбросит конверт
        и выведет код из статуса: 501 → `serverUnavailable` — тот же код, что давал прежний временный вариант
        (`error.code = serverUnavailable`, `details.reason = notImplemented`), поэтому переходного режима не нужно.

        Последствия для агента с club-shell `feat/shell-changes`:
        - HTTP-уровень: 501 не повторяется и не засчитывается circuit breaker'ом (`RetryPolicy.IsTransient`).
        - Прикладной уровень: `notImplemented` не `IsRetryable` — офлайн-фолбэки агента не срабатывают, ошибка
          окончательная:
          - `POST /support/call-admin` — исключение: агент и на `notImplemented` публикует тикет в телеметрию
            (`kind = "callAdmin"`, данные — `CallAdminTicketRequest`) и возвращает шеллу успешный `SysCallAdminResponse`
            с новым `ticketId`. Пока операция `notImplemented`, сервер v1 должен обрабатывать такие записи
            `POST /agents/{pcId}/telemetry`, иначе вызов админа молча теряется;
          - `GET /games/{id}/accounts/lease` — сразу ошибка в шелл (без повторов `AccountPool`); освобождение аренды не
            повторяется (аренда истекает на сервере). Пул по умолчанию выключен (SHELL_CHANGES п. 5);
          - `GET /apps` и прочие операции — в шелл уходит `notImplemented` (кэша у никогда не работавшей операции нет).

        Старые агенты (до `feat/shell-changes`): 501 — «временная» ошибка (любой ≥ 500): `GET`/`PUT`/`DELETE`/`HEAD` и
        `POST` с `Idempotency-Key` уходят до 5 попыток с задержкой 0,5…15 с, каждая — отказ общего circuit breaker'а
        (≥ 80 % отказов при ≥ 5 запросах за 30 с размыкают цепь на 30 с для всех запросов агента); у `serverUnavailable`
        `IsRetryable = true`, поэтому срабатывают офлайн-фолбэки (кэш `GET /apps`, 3 попытки лиза, телеметрия
        `callAdmin`). Учитывать при выборе `x-server-status` для операций, которые вызывают старые агенты.

        Касса (`apps/admin`) не повторяет: показывает `AdminError` с `error.code`.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceIdResponse'
        X-Server-Time:
          $ref: '#/components/headers/XServerTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerErrorEnvelope'
          examples:
            notImplemented:
              value:
                error:
                  code: notImplemented
                  message: Not implemented in server v1
                  details:
                    reason: notImplemented
                  traceId: 6f1d2c3a-5b4e-4d7f-9a8b-0c1d2e3f4a5b
