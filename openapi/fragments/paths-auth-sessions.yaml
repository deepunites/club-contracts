# Группа paths-auth-sessions: клиентские вызовы агента /auth/*, /users/*, /sessions*.
# Источники: src/ClubShell.Core/Http/Endpoints.cs, src/ClubShell.Core/Abstractions/IServerClient.cs,
# src/ClubShell.Core/Http/ServerClient.cs, docs/SERVER_API.md §4.3–4.5, tools/MockServer/src/routes/{auth,session}.ts.
# Приоритет при расхождении: C# агента > MockServer > SERVER_API.md.
paths:

  # ------------------------------------------------------------------------------------------------------------------
  # /auth/*
  # ------------------------------------------------------------------------------------------------------------------

  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: Вход пользователя на ПК (пароль, карта, одноразовый токен)
      description: |
        Вход пользователя с текущего ПК. Режим авторизации `agent` (токен пользователя ещё не выдан).

        - Агент шлёт сюда только `kind` ∈ `password` | `card` | `token` (IPC `auth.login`, а также повторная проверка
          пароля при разблокировке экрана — `SessionLock`). Гостевой вход идёт через `POST /auth/guest`, QR — опросом
          `GET /auth/qr/{token}`. Мок дополнительно принимает `kind = qr` (нужен подтверждённый `qrToken`, иначе
          `401`, `details.reason = "qrNotConfirmed"`) и `kind = guest`.
        - `pcId` в теле должен совпадать с ПК из токена агента, иначе `403 forbidden`, `details.reason = "pcMismatch"` (мок).
        - Успех — `200 AuthResponse`. Сервер привязывает токен пользователя к паре (пользователь, pcId); прежние токены
          пользователей этого ПК отзываются (мок). `session` — открытая сессия этого пользователя на этом ПК (например,
          после перезапуска агента). `offlineHash` — только при `kind = password` и разрешённом офлайн-входе
          (формат — см. `AuthResponse.offlineHash`). Агент сохраняет токены пользователя сам, шеллу их не передаёт.

        Ошибки:
        - `401 unauthorized`, `details.reason = "badCredentials"`, `details.attemptsLeft` — неверные данные входа.
        - `403 forbidden`, `details.reason` ∈ `banned` | `zoneNotAllowed` | `ageRestricted` | `pcMismatch`.
        - `409 conflict` — у пользователя открыта сессия на другом ПК: `details: { reason: "activeSessionElsewhere", pcId, pcName }`
          (`reason` — из мока).

        Внимание: на любой `401`, кроме `details.reason` = `clockSkew` / `userToken`, агент (`ServerClient.SendAsync`)
        один раз обновляет свой токен (`POST /agents/refresh`, с ротацией refresh-токена) и повторяет запрос. Поэтому одна
        неудачная попытка пользователя даёт два `POST /auth/login` подряд, и счётчик `attemptsLeft` уменьшается на 2
        (так ведёт себя и мок). POST без `Idempotency-Key` — агент его автоматически не повторяет.
      x-server-status: required
      x-source:
        - src/ClubShell.Core/Http/Endpoints.cs:33
        - src/ClubShell.Core/Abstractions/IServerClient.cs:154
        - src/ClubShell.Core/Http/ServerClient.cs:210
        - src/ClubShell.Core/Http/ServerClient.cs:725
        - src/ClubShell.Agent/Ipc/Handlers/SessionHandlers.cs:294
        - src/ClubShell.Agent/Session/SessionLock.cs:222
        - docs/SERVER_API.md:231
        - tools/MockServer/src/routes/auth.ts:115
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/XAgentVersion'
        - $ref: '#/components/parameters/XShellVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            examples:
              password:
                value:
                  kind: password
                  username: alisher
                  password: '********'
                  pcId: 7d2f1c3a-1111-4222-8333-444455556666
                  hwid: 3b1f5e0c9a7d4e2f8c6b5a4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f
              card:
                value:
                  kind: card
                  cardId: CARD-0001
                  pcId: 7d2f1c3a-1111-4222-8333-444455556666
                  hwid: 3b1f5e0c9a7d4e2f8c6b5a4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f
      responses:
        '200':
          description: Пользователь вошёл; токены пользователя и (опционально) его открытая сессия на этом ПК.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/qr/start:
    post:
      tags:
        - auth
      operationId: startQrLogin
      summary: Начать вход по QR-коду
      description: |
        Создаёт одноразовый QR-токен для входа через мобильное приложение клуба (IPC `auth.qrStart`). Режим `agent`.

        - Тело `QrStartRequest { pcId }`; агент всегда передаёт свой pcId. Несовпадение с ПК из токена агента —
          `403 forbidden`, `details.reason = "pcMismatch"` (мок; в моке `pcId` необязателен и по умолчанию берётся из токена).
        - Ответ `200 QrLoginStart`: `qrUrl` — deep link `https://<server>/q/<qrToken>`, который шелл рисует как QR-код;
          `pollIntervalSec` — рекомендуемый интервал опроса `GET /auth/qr/{token}` (мок: TTL 120 с, интервал 2 с).
        - Агент вызывает только при наличии связи и известном pcId.
      x-server-status: required
      x-source:
        - src/ClubShell.Core/Http/Endpoints.cs:36
        - src/ClubShell.Core/Abstractions/IServerClient.cs:157
        - src/ClubShell.Core/Http/ServerClient.cs:219
        - src/ClubShell.Agent/Ipc/Handlers/SessionHandlers.cs:377
        - docs/SERVER_API.md:241
        - tools/MockServer/src/routes/auth.ts:163
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/XAgentVersion'
        - $ref: '#/components/parameters/XShellVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrStartRequest'
      responses:
        '200':
          description: QR-токен выдан.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrLoginStart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/qr/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: >-
          `qrToken` из `POST /auth/qr/start` — непрозрачная строка (в моке base64url 24 символа). Агент кодирует сегмент
          `Uri.EscapeDataString`; подпись считается по закодированному пути ровно как отправлено.
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - auth
      operationId: getQrLoginStatus
      summary: Состояние входа по QR-коду
      description: |
        Опрос QR-входа. Режим `agent`. Агент вызывает его, когда шелл присылает `auth.login` с `kind = qr`
        (сам `POST /auth/login` с `kind = qr` агент не использует).

        - `200 QrLoginStatus`: `status` ∈ `pending` → `scanned` → `confirmed` | `expired`.
        - При `confirmed` в ответе есть `auth` (`AuthResponse`) — ровно один раз: следующие чтения возвращают `expired`.
          Агент сохраняет токены из `auth` так же, как после `POST /auth/login`.
        - `pending`, `scanned`, `expired` агент отдаёт шеллу как `unauthorized` (`details.status`).
        - Токен выдан другому ПК — `403 forbidden`, `details.reason = "pcMismatch"`; неизвестный токен — `404 notFound`,
          `details.what = "qrToken"` (мок).
        - Ошибки `409` у входа по QR (активная сессия на другом ПК, `banned` — `403`) те же, что у `POST /auth/login`
          (мок строит `auth` той же функцией).
      x-server-status: required
      x-source:
        - src/ClubShell.Core/Http/Endpoints.cs:102
        - src/ClubShell.Core/Abstractions/IServerClient.cs:160
        - src/ClubShell.Core/Http/ServerClient.cs:226
        - src/ClubShell.Agent/Ipc/Handlers/SessionHandlers.cs:277
        - docs/SERVER_API.md:245
        - tools/MockServer/src/routes/auth.ts:187
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/XAgentVersion'
        - $ref: '#/components/parameters/XShellVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Текущее состояние QR-входа (при `confirmed` — с результатом входа).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrLoginStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/guest:
    post:
      tags:
        - auth
      operationId: guestLogin
      summary: Гостевой вход
      description: |
        Создаёт временного пользователя с ролью `guest` (`username = "guest-<номер ПК>-<n>"`) и выполняет вход.
        Режим `agent`. Агент вызывает для IPC `auth.login` с `kind = guest`: `displayName = null`, `locale` — язык из
        настроек шелла.

        - `pcId` должен совпадать с ПК из токена агента, иначе `403 forbidden`, `details.reason = "pcMismatch"` (мок).
        - Гостевой вход выключен в клубе — `403 forbidden`, `details.reason = "guestDisabled"`.
        - Ответ `200 AuthResponse` (`offlineHash` не выдаётся).
      x-server-status: required
      x-source:
