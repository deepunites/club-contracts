  /auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      summary: Выход пользователя с ПК
      description: |
        Режим `user`. Тело `LogoutRequest { reason }`; ответ `204` без тела (агент принимает любой 2xx и тело не читает).

        - Сервер завершает открытую сессию этого пользователя на этом ПК с причиной `reason` (как `SessionEndReason`) и
          отзывает токены пользователя, привязанные к этому ПК (мок).
        - Агент перед этим сам завершает сессию через `POST /sessions/{id}/end`, поэтому обычно открытой сессии уже нет.
          Агент шлёт только `reason` ∈ `user` | `idle` | `admin`, вызывает операцию только при наличии связи, ошибки
          игнорирует и в любом случае удаляет токены пользователя локально.
      x-server-status: required
      x-source:
        - src/ClubShell.Core/Http/Endpoints.cs:42
        - src/ClubShell.Core/Abstractions/IServerClient.cs:166
        - src/ClubShell.Core/Http/ServerClient.cs:247
        - src/ClubShell.Agent/Ipc/Handlers/SessionHandlers.cs:324
        - docs/SERVER_API.md:255
        - tools/MockServer/src/routes/auth.ts:232
      security:
        - agentBearer: []
          userToken: []
      parameters:
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/XAgentVersion'
        - $ref: '#/components/parameters/XShellVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            examples:
              user:
                value:
                  reason: user
      responses:
        '204':
          description: Пользователь вышел; открытая сессия (если была) завершена. Тела нет.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
