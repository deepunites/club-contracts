        QrLoginStatus.auth. Токены пользователя держит агент, шеллу они не передаются.
      required: [user, accessToken, refreshToken, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
          description: Вошедший пользователь.
        session:
          oneOf:
            - $ref: '#/components/schemas/Session'
            - type: "null"
          description: Открытая сессия этого пользователя на этом ПК (например, после перезапуска агента).
