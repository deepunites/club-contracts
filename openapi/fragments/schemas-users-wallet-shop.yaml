          x-sensitive: true
        refreshToken:
          type: string
          description: Refresh-токен пользователя.
          x-sensitive: true
        expiresAt:
          type: string
          format: date-time
          description: Срок действия access-токена.
        offlineHash:
          type: [string, "null"]
          pattern: '^pbkdf2\$(?:[1-9][0-9]{0,6}|10000000)\$(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{4}|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{2}==)\$(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{4}|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{2}==)$'
          description: >-
            Хеш пароля для офлайн-входа, если клуб разрешает офлайн-вход (только при kind = password). Агент
            проверяет только форму PBKDF2-SHA256 pbkdf2$<итерации 1..10000000>$<соль base64>$<хеш base64>
            (OfflineSessionStore.VerifyPassword); любую другую строку (в т.ч. Argon2id PHC, как пишут doc-комментарий
            C# и мок) агент сохраняет, но офлайн-вход с ней отказывает. Верификатор принимает префикс pbkdf2 в любом
            регистре и ведущие нули в числе итераций, но сервер пишет каноническую форму: префикс строчными, итерации
            без ведущих нулей, соль и хеш — непустой стандартный base64 с дополнением (как HashPassword агента).
          examples:
