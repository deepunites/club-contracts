# Группа schemas-users-wallet-shop: публичные типы из
#   src/ClubShell.Contracts/Users/AuthRequest.cs, Users/UserProfile.cs (namespace ClubShell.Contracts.Users),
#   Wallet/Balance.cs, Wallet/Tariff.cs, Wallet/Transaction.cs (namespace ClubShell.Contracts.Wallet),
#   Shop/Order.cs, Shop/Product.cs (namespace ClubShell.Contracts.Shop).
# Внешние схемы (определяют другие группы, здесь только $ref): Session, SessionEndReason (Session/*.cs),
# PcStatus (Pc/PcStatus.cs).
# Правила провода: JsonDefaults.cs — camelCase, enum как camelCase-строки (CamelCaseEnumConverter на каждом enum,
# целые значения отвергаются), null не пишется (WhenWritingNull), незнакомые поля пропускаются,
# DateTimeOffset -> yyyy-MM-ddTHH:mm:ss.fffZ, TimeOnly -> HH:mm (ClubTimeConverter). Money — собственный
# MoneyJsonConverter (Wallet/Balance.cs:156). В этих файлах нет JsonPropertyName/JsonStringEnumMemberName/
# JsonPolymorphic; JsonIgnore стоит только на вычисляемых свойствах (User.IsMember, Balance.Total,
# OrderItem.LineTotal) — на провод они не попадают.
# Мок пишет null явно (offlineHash: null, qrUrl: null …), C# null опускает: оба варианта валидны, поэтому
# nullable-поля не в required и допускают null.
# Статические классы без формы на проводе: MoneyJsonConverter (его правила — в Money), WeekdayExtensions и
# OrderStatusExtensions (их семантика — расширениями x-* у Weekday/OrderStatus). Классы строковых констант
# UserFlags и ChatRooms — открытые строковые схемы (как PeripheralKinds в schemas-pc).
# PagedResult<T> (Ipc/IpcMessage.cs:343) -> TransactionPage/OrderPage здесь НЕ определяются (чужой файл).
components:
  schemas:

    # ------------------------------------------------------------------ Wallet/Balance.cs

    Money:
      type: object
      description: >-
        Денежная сумма в целых минимальных единицах (тийины для UZS; 1 UZS = 100). Пишется всегда как
        {"amount": <int64>, "currency": "<ISO-4217>"}. Читатель C# (MoneyJsonConverter) сравнивает имена полей
        без учёта регистра, пропускает незнакомые поля, требует целое amount, а отсутствующий/null currency
        трактует как UZS; писатель всегда пишет оба поля. Сервер v1 работает только с UZS (мок отвергает
        другую валюту в запросах: 400 validation, reason = unsupported).
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: >-
            Сумма в минимальных единицах со знаком (отрицательна для списаний, где это оговорено). Сервер
            гарантирует |amount| ≤ 2^53−1, чтобы JS-клиенты (касса, шелл через IPC) не теряли точность; C# принимает
            весь int64.
          x-discrepancy: >-
            C# Money.Amount — long (Balance.cs:15), MoneyJsonConverter читает весь int64 (Balance.cs:186). Контракт
            сужает диапазон до ±(2^53−1): входящие Money TS-клиенты не проверяют — JSON.parse молча теряет точность,
            а Number.isSafeInteger есть только в хелпере money() (packages/contracts-ts/src/wallet.ts:191), который
            в приложениях вызывают лишь моки шелла (apps/shell/src/mocks/handlers.ts:382).
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: UZS
          examples: [UZS]
          description: Код валюты ISO-4217, верхний регистр (C# нормализует). В v1 — только UZS.
      examples:
        - amount: 1500000
          currency: UZS
      x-supported-currencies: [UZS]
      x-csharp: "src/ClubShell.Contracts/Wallet/Balance.cs:15"
      x-csharp-converter: "src/ClubShell.Contracts/Wallet/Balance.cs:156"

    Balance:
      type: object
      description: >-
        Баланс кошелька пользователя (IPC_PROTOCOL §6.12). Ответ GET /wallet/{userId}/balance и полезная нагрузка
        WS-пуша walletUpdated. Вычисляемое C#-свойство Total (amount + bonus) помечено JsonIgnore и на провод
        не попадает.
      required: [userId, amount, bonus, currency, updatedAt]
      properties:
        userId:
          type: string
          format: uuid
          description: Владелец кошелька.
        amount:
          $ref: '#/components/schemas/Money'
          description: Основной (реальные деньги) баланс.
        bonus:
          $ref: '#/components/schemas/Money'
          description: Бонусный баланс (промо, не выводится).
        currency:
          type: string
          examples: [UZS]
          description: Код ISO-4217 обоих балансов.
        updatedAt:
          type: string
          format: date-time
          description: Время последнего изменения (у кэша агента в офлайне — устаревшее).
      x-csharp: "src/ClubShell.Contracts/Wallet/Balance.cs:250"

    # ------------------------------------------------------------------ Wallet/Tariff.cs

    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
      description: День недели в окнах тарифа (пн..вс).
      x-csharp: "src/ClubShell.Contracts/Wallet/Tariff.cs:8"
      x-csharp-helpers: "src/ClubShell.Contracts/Wallet/Tariff.cs:33"

    TariffTimeWindow:
      type: object
      description: >-
        Еженедельное окно действия тарифа по местному времени клуба. from включительно, to исключительно;
        to < from — окно переходит через полночь (хвост [00:00, to) относится к следующему дню); from = to —
        весь день в указанные дни.
      required: [days, from, to]
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/Weekday'
          description: Дни, к которым применяется окно.
        from:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: Начало, HH:mm (читатель C# принимает также H:mm и HH:mm:ss).
        to:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: Конец, HH:mm (исключительно).
      x-csharp: "src/ClubShell.Contracts/Wallet/Tariff.cs:66"

    Tariff:
      type: object
      description: >-
        Тариф (IPC_PROTOCOL §6.11). Элемент ответа GET /tariffs и тарифов кассы. Цена за N минут: пакетная цена,
        если isPackage и packagePrice задан; иначе pricePerHour × N / 60 с округлением вверх до минимальной единицы.
        Тариф действует в зоне, если zones пуст или содержит её (без учёта регистра), и во времени, если timeWindows
        пуст или хотя бы одно окно содержит текущий момент.
      required: [id, name, pricePerHour, minMinutes, zones, timeWindows, isPackage]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор тарифа.
        name:
          type: string
          description: Отображаемое название.
        pricePerHour:
          $ref: '#/components/schemas/Money'
          description: Цена за час.
        minMinutes:
          type: integer
          format: int32
          description: Минимум покупаемых минут.
        maxMinutes:
          type: [integer, "null"]
          format: int32
          description: Максимум покупаемых минут; null — без ограничения.
        zones:
          type: array
          items:
            type: string
          description: Зоны, где действует тариф; пустой — все зоны.
        timeWindows:
          type: array
          items:
            $ref: '#/components/schemas/TariffTimeWindow'
          description: Окна действия; пустой — всегда.
        isPackage:
          type: boolean
          description: Фиксированный пакет (packageMinutes за packagePrice) вместо почасовой оплаты.
        packageMinutes:
          type: [integer, "null"]
          format: int32
          description: Минут в пакете; обязательно при isPackage = true.
        packagePrice:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: "null"
          description: Цена пакета; обязательна при isPackage = true.
      if:
        required: [isPackage]
        properties:
          isPackage:
            const: true
      then:
        required: [packageMinutes, packagePrice]
        properties:
          packageMinutes:
            type: integer
            format: int32
          packagePrice:
            $ref: '#/components/schemas/Money'
      x-csharp: "src/ClubShell.Contracts/Wallet/Tariff.cs:106"

    # ------------------------------------------------------------------ Wallet/Transaction.cs

    TransactionType:
      type: string
      enum: [topUp, charge, refund, bonus, purchase, adjustment]
      description: >-
        Вид операции кошелька: topUp — пополнение (платёжная система или наличные); charge — списание за время
        сессии; refund — возврат неиспользованного предоплаченного времени или отменённого заказа; bonus — промо-
        начисление; purchase — покупка в магазине; adjustment — ручная корректировка администратором.
      x-csharp: "src/ClubShell.Contracts/Wallet/Transaction.cs:8"

    TopupProvider:
      type: string
      enum: [payme, click, uzum, cash]
      description: >-
        Способ пополнения: payme, click — QR / deep link; uzum — Uzum Bank; cash — наличными на кассе
        (создаёт тикет администратору).
      x-csharp: "src/ClubShell.Contracts/Wallet/Transaction.cs:31"

    TopupStatus:
      type: string
      enum: [pending, paid, expired, cancelled]
      description: >-
        Состояние заявки на пополнение: pending — ждёт оплаты; paid — оплачено, баланс обновлён (следом
        walletUpdated); expired — истекла без оплаты; cancelled — отменена пользователем или администратором.
      x-csharp: "src/ClubShell.Contracts/Wallet/Transaction.cs:48"

    Transaction:
      type: object
      description: >-
        Запись журнала кошелька (IPC_PROTOCOL §6.12). Элемент постраничного ответа
        GET /wallet/{userId}/transactions (TransactionPage) и истории клиента в кассе.
      required: [id, userId, type, amount, balanceAfter, description, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор операции.
        userId:
          type: string
          format: uuid
          description: Владелец кошелька.
        type:
          $ref: '#/components/schemas/TransactionType'
          description: Вид операции.
        amount:
          $ref: '#/components/schemas/Money'
          description: Сумма со знаком; отрицательна для charge и purchase.
        balanceAfter:
          $ref: '#/components/schemas/Money'
          description: Основной баланс после операции.
        description:
          type: string
          description: Человекочитаемое описание (локализуется по Accept-Language).
        createdAt:
          type: string
          format: date-time
          description: Время создания.
        ref:
          type: [string, "null"]
          description: Внешняя ссылка — id заказа, сессии или платежа.
      x-csharp: "src/ClubShell.Contracts/Wallet/Transaction.cs:72"

    TopupIntent:
      type: object
      description: >-
        Заявка на пополнение, ожидающая или завершённая (IPC_PROTOCOL §6.12). Ответ
        POST /wallet/{userId}/topup-intent (201) и GET /wallet/{userId}/topup-intent/{id}; завершение приходит
        WS-пушем walletUpdated.
      required: [id, provider, amount, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор заявки.
        provider:
          $ref: '#/components/schemas/TopupProvider'
          description: Способ оплаты.
        amount:
          $ref: '#/components/schemas/Money'
          description: Запрошенная сумма.
        status:
          $ref: '#/components/schemas/TopupStatus'
          description: Текущее состояние.
        qrUrl:
          type: [string, "null"]
          description: URL картинки QR для показа, если провайдер поддерживает оплату по QR.
        deepLink:
          type: [string, "null"]
          description: Deep link в мобильное приложение провайдера, если есть.
        paymentUrl:
          type: [string, "null"]
          description: Веб-страница оплаты, если есть.
        expiresAt:
          type: string
          format: date-time
          description: Когда заявка истечёт без оплаты.
        createdAt:
          type: string
          format: date-time
          description: Время создания.
      x-csharp: "src/ClubShell.Contracts/Wallet/Transaction.cs:92"

    TopupIntentCreateRequest:
      type: object
      description: Тело POST /wallet/{userId}/topup-intent (SERVER_API §4.8); отправляется с Idempotency-Key.
      required: [amount, provider, pcId]
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
            - type: object
              properties:
                amount:
                  minimum: 100000
          description: >-
            Запрошенная сумма; не меньше 1 000 UZS (100 000 минимальных единиц, TopupIntentCreateRequest.MinAmountMinor —
            агент проверяет до отправки). Мок дополнительно ограничивает сверху 10 000 000 000 (100 млн UZS).
        provider:
          $ref: '#/components/schemas/TopupProvider'
          description: Способ оплаты.
        pcId:
          type: string
          format: uuid
          description: ПК, с которого пришёл запрос (должен совпадать с ПК агента).
      x-min-amount-minor: 100000
      x-csharp: "src/ClubShell.Contracts/Wallet/Transaction.cs:107"

    # ------------------------------------------------------------------ Shop/Product.cs

    ProductCategory:
      type: string
      enum: [food, drink, snack, service, merch, time]
      description: >-
        Категория товара: food — горячая еда; drink — напитки; snack — снеки; service — услуги (например, аренда
        гарнитуры); merch — мерч; time — пакеты времени, продаваемые через магазин.
      x-csharp: "src/ClubShell.Contracts/Shop/Product.cs:9"

    Product:
      type: object
      description: Товар магазина (IPC_PROTOCOL §6.13). Элемент ответа GET /shop/products и склада кассы.
      required: [id, title, category, price, imageUrl, inStock, tags]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор товара.
        title:
          type: string
          description: Название (локализуется по Accept-Language).
        category:
          $ref: '#/components/schemas/ProductCategory'
          description: Категория.
        price:
          $ref: '#/components/schemas/Money'
          description: Цена за единицу.
        imageUrl:
          type: string
          description: URL картинки.
        inStock:
          type: boolean
          description: Есть в наличии (в офлайн-кэше агента неизвестно и показывается как «есть»).
        stockQty:
          type: [integer, "null"]
          format: int32
          description: Остаток, если склад ведётся.
        tags:
          type: array
          items:
            type: string
          description: Произвольные теги (агент ищет и по ним).
      x-csharp: "src/ClubShell.Contracts/Shop/Product.cs:39"

    # ------------------------------------------------------------------ Shop/Order.cs

    OrderStatus:
      type: string
      enum: [pending, accepted, preparing, delivering, done, cancelled]
      description: >-
        Жизненный цикл заказа: pending — оформлен, ждёт принятия персоналом, можно отменить; accepted — принят;
        preparing — готовится; delivering — несут к месту; done — доставлен; cancelled — отменён пользователем или
        персоналом, списанная сумма возвращена.
      x-active-states: [pending, accepted, preparing, delivering]
      x-cancellable-states: [pending]
      x-csharp: "src/ClubShell.Contracts/Shop/Order.cs:9"
      x-csharp-helpers: "src/ClubShell.Contracts/Shop/Order.cs:31"

    OrderItem:
      type: object
      description: >-
        Строка оформленного заказа; price — цена за единицу на момент заказа. Вычисляемое C#-свойство LineTotal
        (price × qty) помечено JsonIgnore и на провод не попадает.
      required: [productId, title, qty, price]
      properties:
        productId:
          type: string
          format: uuid
          description: Товар.
        title:
          type: string
          description: Название товара на момент заказа.
        qty:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
          description: Количество (1–99).
        price:
          $ref: '#/components/schemas/Money'
          description: Цена за единицу на момент заказа.
      x-csharp: "src/ClubShell.Contracts/Shop/Order.cs:42"

    OrderLineRequest:
      type: object
      description: Строка создаваемого заказа (POST /shop/orders).
      required: [productId, qty]
      properties:
        productId:
          type: string
          format: uuid
          description: Товар (агент не отправляет пустой uuid).
        qty:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
          description: Количество (1–99, OrderLineRequest.MaxQty).
      x-csharp: "src/ClubShell.Contracts/Shop/Order.cs:56"

    Order:
      type: object
      description: >-
        Заказ в магазине (IPC_PROTOCOL §6.13). Ответ POST /shop/orders (201), GET /shop/orders/{id},
        POST /shop/orders/{id}/cancel, элемент OrderPage и полезная нагрузка WS-пуша orderUpdated.
      required: [id, userId, pcId, items, total, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор заказа.
        userId:
          type: string
          format: uuid
          description: Покупатель.
        pcId:
          type: string
          format: uuid
          description: Место доставки.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          description: Строки заказа.
        total:
          $ref: '#/components/schemas/Money'
          description: Списанная сумма (Σ price × qty).
        status:
          $ref: '#/components/schemas/OrderStatus'
          description: Текущее состояние.
        createdAt:
          type: string
          format: date-time
          description: Время создания.
        updatedAt:
          type: string
          format: date-time
          description: Время последней смены статуса.
        note:
          type: [string, "null"]
          description: Комментарий для персонала.
      x-csharp: "src/ClubShell.Contracts/Shop/Order.cs:77"

    OrderCreateRequest:
      type: object
      description: Тело POST /shop/orders (SERVER_API §4.9); отправляется с Idempotency-Key.
      required: [userId, pcId, items]
      properties:
        userId:
          type: string
          format: uuid
          description: Покупатель (владелец X-User-Token).
        pcId:
          type: string
          format: uuid
          description: Место доставки (ПК агента).
        sessionId:
          type: [string, "null"]
          format: uuid
          description: Текущая сессия, если есть.
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/OrderLineRequest'
          description: Строки заказа (1–20, OrderLineRequest.MaxLines).
        note:
          type: [string, "null"]
          maxLength: 500
          description: >-
            Комментарий для персонала. Агент пропускает до 500 символов (SessionHandlers.cs:545); мок отвергает
            длиннее 300 — 400 validation, reason max.
          x-discrepancy: >-
            Агент: note ≤ 500 (UserDomainHandlers.MaxNoteLength, SessionHandlers.cs:545, проверка :767). Мок:
            optStr(b, 'note', 300) (tools/MockServer/src/routes/shop.ts:85) — длиннее 300 даёт 400 validation max
            (db.ts:357), а не обрезку. По приоритету (C# агента > мок) в контракте 500.
      x-csharp: "src/ClubShell.Contracts/Shop/Order.cs:94"

    # ------------------------------------------------------------------ Users/AuthRequest.cs

    AuthKind:
      type: string
      enum: [password, qr, guest, card, token]
      description: >-
        Способ входа: password — логин + пароль; qr — QR-код, отсканированный мобильным приложением клуба;
        guest — временный гостевой аккаунт; card — NFC/RFID-карта; token — одноразовый токен админки/веба.
      x-csharp: "src/ClubShell.Contracts/Users/AuthRequest.cs:9"

    QrStatus:
      type: string
      enum: [pending, scanned, confirmed, expired]
      description: >-
        Состояние QR-входа: pending — ещё не отсканирован; scanned — отсканирован, ждёт подтверждения в приложении;
        confirmed — подтверждён, в QrLoginStatus.auth лежит AuthResponse (однократное чтение); expired — истёк или
        уже использован.
      x-csharp: "src/ClubShell.Contracts/Users/AuthRequest.cs:29"

    AuthRequest:
      type: object
      description: >-
        Тело POST /auth/login (IPC_PROTOCOL §6.20). Заполняются поля, соответствующие kind. Агент шлёт сюда только
        password, card и token: гостевой вход идёт через POST /auth/guest, QR — опросом GET /auth/qr/{token}.
        Секреты (password, qrToken, cardId, token) нельзя логировать.
      required: [kind, pcId, hwid]
      properties:
        kind:
          $ref: '#/components/schemas/AuthKind'
          description: Способ входа.
          x-agent-sends: [password, card, token]
        username:
          type: [string, "null"]
          minLength: 3
          maxLength: 32
          description: Логин (kind = password), 3–32 символа.
        password:
          type: [string, "null"]
          format: password
          maxLength: 256
          description: Пароль (kind = password); агент пропускает до 256 символов (мок — до 128).
          x-sensitive: true
          x-discrepancy: >-
            Агент отвергает пароль длиннее 256 (SessionHandlers.cs:483). Мок: str(b, 'password', 128)
            (tools/MockServer/src/routes/auth.ts:126) — длиннее 128 даёт 400 validation max. По приоритету
            (C# агента > мок) в контракте 256.
        qrToken:
          type: [string, "null"]
          description: QR-токен (kind = qr).
          x-sensitive: true
        cardId:
          type: [string, "null"]
          description: Номер карты (kind = card).
          x-sensitive: true
        token:
          type: [string, "null"]
