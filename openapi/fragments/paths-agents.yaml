# Группа paths-agents: маршруты агента /agents/*, /pcs*, /updates/*, /support/*, /anticheat/*.
# Источник истины — C# агента (Endpoints.cs, IServerClient.cs, ServerClient.cs) > MockServer (routes/pcs.ts) > SERVER_API.md.
# Пути x-source указаны от корня репозитория club-shell.
paths:
  /agents/register:
    post:
      tags:
        - agents
      operationId: register
      summary: Регистрация ПК (агента) в клубе
      description: |
        Первичная и повторная регистрация агента по ключу клуба (`X-Club-Key`, без Bearer и без подписи). Сервер
        находит ПК по `hwid` (или по подсказке `previousPcId` после переустановки) и выдаёт токены агента, секрет подписи
        и конфигурацию. Новый, неизвестный ПК создаётся в статусе `maintenance` и получает `403 forbidden`,
        `details.reason = "pendingApproval"` (`details.pcId`) до одобрения администратором.

        Когда агент регистрируется (`ServerConnection`):
        - при каждом старте процесса, если токенов нет или сохранённый access-токен истёк либо истекает в ближайшие
          2 мин, — refresh в этом случае не вызывается (access-токен живёт ≈ 1 ч, так что это, например, каждое утро
          после выключения ПК);
        - на пути WebSocket, если refresh отвергнут (401/403).
        Поэтому повторная регистрация известного `hwid` — штатный путь: сервер должен без побочных эффектов вернуть тот
        же `pcId` и выдать новые токены и секрет подписи — не создавать новый ПК и не менять одобрение, статус и
        открытую сессию (мок лишь обновляет инвентаризацию и переводит `offline` → `free`).
        Любую ошибку регистрации (включая 403) агент повторяет с backoff 3…60 с. Автоматических HTTP-повторов нет
        (POST без `Idempotency-Key`).

        Из ответа агент использует только `pcId`, `pc` (имя и зона — в лог), `accessToken`, `refreshToken`,
        `signingSecret`, `expiresAt` и `serverTime` (смещение часов). `config` текущий агент игнорирует (не сохраняет и
        не применяет): конфигурацию он получает только через `GET /agents/{pcId}/config` после первого heartbeat.
      x-server-status: required
      x-source:
        - src/ClubShell.Core/Http/Endpoints.cs:24
        - src/ClubShell.Core/Abstractions/IServerClient.cs:120
        - src/ClubShell.Core/Http/ServerClient.cs:137
        - src/ClubShell.Core/Http/ServerClient.cs:141
        - src/ClubShell.Core/Http/ServerClient.cs:813
        - src/ClubShell.Agent/Server/ServerConnection.cs:224
        - src/ClubShell.Agent/Server/ServerConnection.cs:229
        - src/ClubShell.Agent/Server/ServerConnection.cs:239
        - src/ClubShell.Agent/Server/ServerConnection.cs:256
        - src/ClubShell.Agent/Server/ServerConnection.cs:271
        - docs/SERVER_API.md:36
        - docs/SERVER_API.md:116
        - docs/SERVER_API.md:143
        - tools/MockServer/src/routes/pcs.ts:103
        - tools/MockServer/src/routes/pcs.ts:65
      security:
        - clubKey: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/XAgentVersion'
        - $ref: '#/components/parameters/XShellVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegisterRequest'
      responses:
        '200':
          description: ПК зарегистрирован; выданы токены агента, секрет подписи и конфигурация.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: |
            `unauthorized`, `details.reason = "clubKey"` — нет или неверен `X-Club-Key`. Агент повторяет регистрацию
            с backoff; обновление токена не выполняется.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: |
            `forbidden`, `details.reason`:
            - `pendingApproval` — ПК новый и ждёт одобрения администратора (`details.pcId` — созданный ПК в статусе
              `maintenance`);
            - `clubDisabled` — клуб отключён.
            Агент повторяет регистрацию с backoff 3…60 с.
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`conflict` — `hwid` привязан к ПК другого клуба.'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agents/refresh:
    post:
      tags:
        - agents
      operationId: refresh
      summary: Обновление токенов агента
      description: |
        Ротация токенов агента по одноразовому `refreshToken` и `hwid` (оба в теле; без Bearer и без подписи).
        Старый refresh-токен после успеха недействителен. `signingSecret` в ответе — только при ротации секрета
        подписи; агент переключается на него атомарно, иначе сохраняет прежний.

        Когда агент вызывает refresh (однопоточно, single-flight):
        - реактивно — на `401` любого запроса с авторизацией агента или пользователя, кроме `details.reason = userToken`
          (при `clockSkew` сначала один повтор с поправкой часов); после refresh исходный запрос повторяется один раз;
        - заранее (access-токен истёк или истекает в ближайшие 2 мин) — только перед (пере)подключением WebSocket, а
          также после отказа WS по токену.
        Таймера упреждающего обновления нет. При старте процесса с истёкшим/истекающим токеном агент не обновляет его, а
        регистрируется заново (`POST /agents/register`).
        `401/403` на refresh на пути WebSocket ведёт к повторной регистрации; при реактивном refresh ошибка уходит
        исходному запросу (перерегистрации нет). POST без `Idempotency-Key` — автоматически не повторяется.
      x-server-status: required
      x-source:
        - src/ClubShell.Core/Http/Endpoints.cs:27
        - src/ClubShell.Core/Abstractions/IServerClient.cs:123
        - src/ClubShell.Core/Http/ServerClient.cs:148
        - src/ClubShell.Core/Http/ServerClient.cs:729
        - src/ClubShell.Core/Http/ServerClient.cs:843
        - src/ClubShell.Core/Http/ServerClient.cs:862
        - src/ClubShell.Agent/Server/ServerConnection.cs:278
        - src/ClubShell.Agent/Server/ServerConnection.cs:287
        - src/ClubShell.Agent/Server/ServerConnection.cs:300
        - src/ClubShell.Agent/Server/ServerConnection.cs:306
        - docs/SERVER_API.md:40
        - docs/SERVER_API.md:146
        - tools/MockServer/src/routes/pcs.ts:138
      security: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/XAgentVersion'
        - $ref: '#/components/parameters/XShellVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRefreshRequest'
      responses:
        '200':
          description: Новые токены агента.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: |
            `unauthorized`, `details.reason`:
            - `expired` — refresh-токен истёк (30 дней);
            - `revoked` — токен неизвестен/отозван, ПК удалён или `hwid` не совпадает с ПК токена;
            - `reused` — токен уже использован (ротация одноразовая).
            На пути WebSocket агент в ответ регистрируется заново (`POST /agents/register`); при реактивном refresh
            ошибка уходит исходному запросу.
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agents/{pcId}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/PcId'
    post:
      tags:
        - agents
      operationId: heartbeat
      summary: Heartbeat агента
      description: |
        Периодический отчёт агента (каждые `session.heartbeatSec`, по умолчанию 30 с, минимум 5 с). В ответе —
        состояние и версии на стороне сервера, по которым агент:
        - выставляет смещение часов по `serverTime`;
        - перезапрашивает `GET /agents/{pcId}/policies`, если `policyVersion` новее применённой;
        - запрашивает `GET /agents/{pcId}/config` на первом heartbeat и при каждой смене `configVersion`;
        - обновляет каталоги игр/приложений при смене `catalogVersion` (первое значение — только базовая точка);
        - при `pendingCommands > 0` забирает команды `GET /agents/{pcId}/commands` (независимо от состояния WS).
        `pcStatus` и `session` текущий агент не читает: это только взгляд сервера (SERVER_API задумывает `session` для
        сверки сессии, агент её не выполняет — см. `x-discrepancy`).
        Ошибки агент только логирует; автоматических HTTP-повторов нет (POST без `Idempotency-Key`).
      x-discrepancy: >-
        SERVER_API.md:173 называет pcStatus авторитетным статусом ПК, а SERVER_API.md:178 — session взглядом сервера на
        текущую сессию для сверки (reconciliation); мок (tools/MockServer/src/routes/pcs.ts:173-181) заполняет оба поля.
        C# агента читает из HeartbeatResponse только serverTime (ServerClient.cs:167, Heartbeat.cs:182), policyVersion
        (Heartbeat.cs:189), configVersion и catalogVersion (Heartbeat.cs:223-224) и pendingCommands (Heartbeat.cs:197);
        pcStatus и session нигде не используются (grep HeartbeatResponse по src/: ServerCommand.cs:794,
        IServerClient.cs:126, ServerClient.cs:163-166, Heartbeat.cs:218, JsonDefaults.cs:403). Поля в контракте
        сохранены по C# (pcStatus обязателен), но сервер не может рассчитывать, что агент по ним сменит статус или
        сверит сессию.
      x-server-status: required
      x-source:
        - src/ClubShell.Core/Http/Endpoints.cs:81
        - src/ClubShell.Core/Abstractions/IServerClient.cs:126
        - src/ClubShell.Core/Http/ServerClient.cs:163
        - src/ClubShell.Agent/Server/Heartbeat.cs:163
        - src/ClubShell.Agent/Server/Heartbeat.cs:218
        - docs/SERVER_API.md:151
        - docs/SERVER_API.md:180
        - tools/MockServer/src/routes/pcs.ts:153
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/XAgentVersion'
        - $ref: '#/components/parameters/XShellVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: Авторитетное состояние ПК и версии политики/конфига/каталога.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`forbidden`, `details.reason = "pcMismatch"` — `pcId` пути не совпадает с ПК из токена агента.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: |
            `notFound`, `details.what = "pc"` — ПК удалён (SERVER_API: агент должен перерегистрироваться). Внимание:
            текущий агент на 404 heartbeat только логирует ошибку; перерегистрация происходит лишь после отказа
            refresh (`401 revoked`). Мок для удалённого ПК отвечает `401`, `details.reason = "revoked"`.
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agents/{pcId}/telemetry:
    parameters:
      - $ref: '#/components/parameters/PcId'
    post:
      tags:
        - agents
      operationId: sendTelemetry
      summary: Выгрузка телеметрии
      description: |
        Пачка метрик (`samples`, ≤ 120), диагностических событий агента (`events`) и, при изменении/пересканировании,
        инвентаризации (`hardware`); при непустых `events` — хвост лога (`logsTail`, ≤ 50 строк Warning+). Отправляется
        каждые `telemetry.uploadIntervalSec` (по умолчанию 60 с). Пока выгрузка не удаётся, агент копит до 120 замеров и
        до 1024 событий и шлёт их одной пачкой без деления — отказ `400` на валидной пачке заблокирует выгрузку.
        Среди событий бывает `kind = "callAdmin"` с `data` = `CallAdminTicketRequest` — вызов администратора, не
        доставленный через `POST /support/call-admin` (временная ошибка/офлайн). Пока `POST /support/call-admin`
        не реализован (`notImplemented`: 501 агент считает временной ошибкой), это единственный канал вызова
        администратора — сервер v1 должен разбирать такие события, иначе вызовы молча теряются.
        Автоматических HTTP-повторов нет (POST без `Idempotency-Key`); неотправленное остаётся до следующей попытки.
      x-server-status: required
      x-source:
        - src/ClubShell.Core/Http/Endpoints.cs:84
        - src/ClubShell.Core/Abstractions/IServerClient.cs:129
        - src/ClubShell.Core/Http/ServerClient.cs:172
        - src/ClubShell.Agent/Server/TelemetryReporter.cs:96
        - src/ClubShell.Agent/Server/TelemetryReporter.cs:294
        - src/ClubShell.Agent/Ipc/Handlers/SystemHandlers.cs:48
        - src/ClubShell.Agent/Ipc/Handlers/SystemHandlers.cs:253
        - docs/SERVER_API.md:186
        - docs/SERVER_API.md:197
        - tools/MockServer/src/routes/pcs.ts:184
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/XAgentVersion'
        - $ref: '#/components/parameters/XShellVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryBatch'
      responses:
        '204':
          description: Пачка принята.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: |
            `validation` — нарушена форма пачки (`details.field`: `samples`, `events`, `samples[i]`, …). Сервер обязан
            принимать до 120 `samples` и до 1024 `events` (агент пачку не делит).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`forbidden`, `details.reason = "pcMismatch"` — `pcId` пути не совпадает с ПК из токена агента.'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

