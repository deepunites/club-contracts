        в офлайн-хранилище; active — таймер идёт; paused — пауза пользователем, таймер стоит; locked — заблокирована
        (пользователь отошёл / администратор), таймер идёт, если тариф не ставит на паузу при блокировке;
        ending — время вышло, льготный период до принудительного завершения; ended — завершена и рассчитана.
      x-agent-fallback: unknown
      x-open-states: [starting, active, paused, locked, ending]
      x-session-requests-states: [active, paused]
      x-timer-running-states: [active, locked, ending]
      x-csharp: "src/ClubShell.Contracts/Session/SessionState.cs:9"
      x-csharp-helpers: "src/ClubShell.Contracts/Session/SessionState.cs:34"

