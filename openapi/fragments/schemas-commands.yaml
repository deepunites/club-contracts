          name: lock
          payload: {reason: admin, message: Please come to the desk}
          expiresAt: "2026-09-21T10:25:00.000Z"
        - type: ack
          id: 77aa0b1c-2d3e-4f50-8a9b-0c1d2e3f4a5b
          ts: "2026-09-21T10:20:00.050Z"
          payload: null
          ack: {id: c0a8f5e2-1d3b-4c5a-9e7f-0a1b2c3d4e5f, ok: true}
