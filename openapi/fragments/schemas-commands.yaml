      type: object
      description: >-
        Один текстовый кадр на wss://<server>/ws/agent (сабпротокол clubshell.v1), не больше 1 МиБ. name обязателен
        для command/event/push (ServerCommandType / AgentEventType / WsPushKind); ack — для type = ack. Команду с
        неизвестным name агент подтверждает ack { ok: false, error.code: notFound }. Ключ payload агент пишет всегда.
      required: [type, id, ts, payload]
      properties:
        type:
