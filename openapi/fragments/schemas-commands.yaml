# Группа schemas-commands: публичные типы из
#   src/ClubShell.Contracts/Commands/ServerCommand.cs (регистрация/refresh/heartbeat/telemetry агента, WS-кадры,
#     команды сервер -> агент с payload и результатами, события агента, push-уведомления, UpdateManifest),
#   src/ClubShell.Contracts/Errors/ErrorCode.cs (ErrorCode, ServerErrorEnvelope, ServerError),
#   src/ClubShell.Contracts/Ipc/IpcErrors.cs (IpcError и все *Details).
# Пропущены: IpcException (исключение, не провод); статические классы-помощники без данных
#   ServerCommandTypes, WsPushKinds, ErrorCodes (таблицы ErrorCodes перенесены в x-* расширения схемы ErrorCode);
#   Commands/AgentCommand.cs (IPC агент <-> шелл; ни один серверный тип его не использует).
# TelemetryEventKinds (класс строковых констант) описан как открытый набор строк — по образцу PeripheralKinds.
# Внешние схемы (определяют другие группы, здесь только $ref): Money, AntiCheatKind, HardwareInfo, Pc,
#   AgentServerConfig, PcStatus, PcMetrics, Session, SessionEndReason, NotificationLevel, CallAdminCategory,
#   LaunchRequest, LaunchResult, Policy, GamesKillResponse, UpdateApplyResponse, ShowAdsArgs, SetVolumeRequest,
#   VolumeState, SessionStartedEvent, SessionEndedEvent, AntiCheatReport, Balance, ChatMessage, Notification,
#   Order, Booking, Tournament (последние — только по имени в x-*-schemas, не через $ref).
# Правила провода: JsonDefaults.cs — camelCase, enum как camelCase-строки (CamelCaseEnumConverter; неизвестная
# строка = JsonException у агента, кроме enum с x-agent-fallback: unknown — агент с club-shell feat/shell-changes читает
# её как unknown, JsonDefaults.cs:112), null не пишется (WhenWritingNull), незнакомые поля пропускаются,
# DateTimeOffset -> yyyy-MM-ddTHH:mm:ss.fffZ. Переопределения в этих файлах: JsonIgnore(Never) у ServerError.details,
# IpcError.details, WsFrame.payload (ключ пишется всегда, даже null); [JsonIgnore] у RefreshConfigCommand.IsAll,
# AgentEvent.WireName, IpcError.IsRetryable (на провод не попадают). JsonPolymorphic/JsonPropertyName нет.
components:
  schemas:

    # ------------------------------------------------------------------ Errors/ErrorCode.cs

    ErrorCode:
      type: string
      enum:
        - unauthorized
        - forbidden
        - notFound
        - validation
        - conflict
        - insufficientFunds
        - sessionNotActive
        - sessionAlreadyActive
        - gameNotInstalled
        - gameLaunchFailed
        - accountPoolExhausted
        - antiCheatBlocked
        - policyDenied
        - agentOffline
        - serverUnavailable
        - timeout
        - rateLimited
        - internal
        - protocolError
        - versionMismatch
        - notImplemented
      description: >-
        Код ошибки; один и тот же набор в REST-конверте (error.code), IPC (IpcError.code) и шелле. Сервер обязан
        использовать только эти значения. ErrorCode остаётся строгим (x-agent-fallback нет): код, которого агент не
        знает, выводится из HTTP-статуса (x-from-http-status); агент с club-shell feat/shell-changes сохраняет при этом
        message, details и traceId (ServerClient.cs:645), старые агенты отбрасывают конверт целиком. HTTP-статус ответа
        должен совпадать с x-http-status. agentOffline, protocolError (для IPC-кадров) и timeout в основном порождает сам
        агент; «не реализовано» (501) — notImplemented.
      x-enum-descriptions:
        unauthorized: Не аутентифицирован, неверный/истёкший токен или учётные данные (401).
        forbidden: Аутентифицирован, но нет прав (роль, привязка, возможность) (403).
        notFound: >-
          Сущность (или имя IPC-сообщения) не найдена (404). В REST details = null или свободный объект (мок шлёт
          { what }); details { name } (C# NameDetails) бывают только в IPC и в контракт не входят.
        validation: Неверные данные; details = ValidationDetails (400).
        conflict: Конфликт состояния — дубликат, нет в наличии, уже вступил (409).
        insufficientFunds: Недостаточно средств; details = InsufficientFundsDetails (402).
        sessionNotActive: >-
          Операции нужна активная/приостановленная сессия (409); details = { session: Session } или null. Если
          сессия уже завершена, сервер обязан вернуть details.session (state = ended): на POST /sessions/{id}/end
          агент считает такой ответ успехом (идемпотентный повтор завершения), без details.session повтор упадёт.
        sessionAlreadyActive: Сессия уже открыта (409).
        gameNotInstalled: Игра не установлена или нет пути установки (409).
        gameLaunchFailed: Ошибка лаунчера; details = LaunchFailedDetails (500).
        accountPoolExhausted: Нет свободного аккаунта из пула (409).
        antiCheatBlocked: Не выполнено требование античита; details = AntiCheatBlockedDetails (403).
        policyDenied: Запрещено политикой; details = PolicyDeniedDetails (403).
        agentOffline: Агент без связи с сервером, кэш не помогает (503).
        serverUnavailable: Сервер вернул 5xx или разомкнут circuit breaker (503).
        timeout: Таймаут вышестоящего вызова или запуска (504).
        rateLimited: Слишком много запросов; details = RateLimitDetails, заголовок Retry-After (429).
        internal: Непредвиденная ошибка; details = TraceDetails (500).
        protocolError: Нарушение формата конверта/кадра (400).
        versionMismatch: Версия протокола/приложения не поддерживается; details = VersionMismatchDetails (426).
        notImplemented: >-
          Операция есть в контракте, но этот сервер её не реализует (501, ответ NotImplemented); details = null или
          ReasonDetails (reason = notImplemented). Не повторяется: агент не ретраит 501 и не засчитывает его в circuit
          breaker (RetryPolicy.cs:57), IsRetryable = false.
      x-enum-added:
        notImplemented: >-
          club-shell feat/shell-changes (SHELL_CHANGES п. 1): агент, шелл (Rust/TS после ContractsGen) и касса знают
          значение. Старый агент код не распарсит, отбросит конверт и по статусу 501 выведет serverUnavailable — то же,
          что давал прежний временный вариант (serverUnavailable + details.reason = notImplemented).
      x-http-status:
        unauthorized: 401
        forbidden: 403
        notFound: 404
        validation: 400
        conflict: 409
        insufficientFunds: 402
        sessionNotActive: 409
        sessionAlreadyActive: 409
        gameNotInstalled: 409
        gameLaunchFailed: 500
        accountPoolExhausted: 409
        antiCheatBlocked: 403
        policyDenied: 403
        agentOffline: 503
        serverUnavailable: 503
        timeout: 504
        rateLimited: 429
        internal: 500
        protocolError: 400
        versionMismatch: 426
        notImplemented: 501
      x-from-http-status:
        description: >-
          Обратное отображение, которым агент пользуется, когда тело ответа не распарсилось как ServerErrorEnvelope
          (ErrorCodes.FromHttpStatus).
        "400": validation
        "401": unauthorized
        "402": insufficientFunds
        "403": forbidden
        "404": notFound
        "408": timeout
        "409": conflict
        "426": versionMismatch
        "429": rateLimited
        "501": notImplemented
        "504": timeout
        ">=500": serverUnavailable
        other: internal
      x-retryable: [timeout, rateLimited, serverUnavailable, agentOffline]
      x-auth-failure: [unauthorized, forbidden]
      x-details-schemas:
        unauthorized: ReasonDetails
        forbidden: ReasonDetails
        conflict: ReasonDetails
        notFound: "REST: null | { what: string } (мок); { name } (C# NameDetails) — только IPC, неизвестное имя сообщения"
        validation: ValidationDetails
        insufficientFunds: InsufficientFundsDetails
        sessionNotActive: "{ session: Session } | null (session обязателен, если сессия уже завершена)"
        policyDenied: PolicyDeniedDetails
        antiCheatBlocked: AntiCheatBlockedDetails
        gameLaunchFailed: LaunchFailedDetails
        versionMismatch: VersionMismatchDetails
        rateLimited: RateLimitDetails
        serverUnavailable: ReasonDetails
        notImplemented: "null | ReasonDetails (reason = notImplemented)"
        internal: TraceDetails
      x-discrepancy: >-
        notFound: в C# у IpcError.NotFound(what) details нет (null), NameDetails создаётся только в
        IpcError.UnknownMessage для IPC (IpcErrors.cs:46-49; в ack команды на сервер не попадает: неизвестное имя
        команды агент подтверждает notFound без details — по WS RealtimeClient.cs:361, по REST-пути Heartbeat.cs:361;
        ветка UnknownMessage в CommandReceiver недостижима — switch покрывает все значения ServerCommandType); мок на
        REST шлёт details = { what } (db.ts:76);
        SERVER_API.md форму details для notFound не задаёт. В контракте: REST details = null или свободный объект;
        ни агент, ни шелл details.what не читают (агент передаёт details шеллу как есть).
      x-csharp: "src/ClubShell.Contracts/Errors/ErrorCode.cs:14"
      x-source:
        - "src/ClubShell.Contracts/Errors/ErrorCode.cs:76"
        - "src/ClubShell.Contracts/Errors/ErrorCode.cs:141"
        - "src/ClubShell.Contracts/Errors/ErrorCode.cs:162"
        - "src/ClubShell.Core/Http/ServerClient.cs:615"
        - "src/ClubShell.Core/Http/ServerClient.cs:645"
        - "src/ClubShell.Core/Http/RetryPolicy.cs:57"
        - "docs/IPC_PROTOCOL.md:117"
        - "src/ClubShell.Core/Http/ServerClient.cs:314"
        - "src/ClubShell.Core/Http/ServerClient.cs:574"
        - "src/ClubShell.Core/Abstractions/IServerClient.cs:199"
        - "docs/SERVER_API.md:293"
        - "tools/MockServer/src/db.ts:76"
        - "tools/MockServer/src/db.ts:85"
        - "src/ClubShell.Contracts/Ipc/IpcErrors.cs:46"

    ServerErrorEnvelope:
      type: object
      description: 'Тело любого не-2xx ответа центрального сервера (кроме 304) — { "error": ServerError }.'
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ServerError'
      examples:
        - error:
            code: insufficientFunds
            message: Balance too low
            details:
              required: {amount: 500000, currency: UZS}
              available: {amount: 120000, currency: UZS}
            traceId: 6f1d2c3a-5b4e-4d7f-9a8b-0c1d2e3f4a5b
      x-csharp: "src/ClubShell.Contracts/Errors/ErrorCode.cs:171"
      x-source:
        - "src/ClubShell.Core/Http/ServerClient.cs:589"
        - "docs/SERVER_API.md:87"
        - "tools/MockServer/src/index.ts:191"

    ServerError:
      type: object
      description: >-
        Объект ошибки сервера. Агент отображает его 1:1 в IpcError для шелла (details передаются как есть, traceId
        переносится в details.traceId). Поведение агента на 401 для запросов с авторизацией agent/user (club и none
        не обрабатываются) по details.reason: clockSkew при наличии заголовка X-Server-Time — поправка часов и один
        повтор; userToken — без refresh, ошибка уходит шеллу; любая другая причина или её отсутствие (expired,
        invalid, revoked, reused, signature, clockSkew без X-Server-Time и т.д.) — один refresh токена агента
        (POST /agents/refresh, если его ещё не обновил параллельный запрос) и повтор. Второго refresh нет: следующий
        401 (кроме первого clockSkew с X-Server-Time) возвращается вызывающему как ошибка.
      required: [code, message, details, traceId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Сообщение на английском для логов; UI локализует по code.
        details:
          description: >-
            Структурированные данные ошибки. Ключ присутствует всегда (JsonIgnore(Never)), null — если данных нет.
            В C# это JsonElement? (любой JSON); на практике объект или null. Форма по коду — ErrorCode.x-details-schemas;
            поля сверх типизированных допустимы (например, pcId у pendingApproval, problem у unauthorized от проверки
            подписи; attemptsLeft у unauthorized badCredentials на POST /auth/login; pcId и pcName у conflict
            activeSessionElsewhere; productId у conflict outOfStock). Для sessionNotActive — { session: Session }
            или null (session обязателен, если сессия уже завершена).
        traceId:
          type: string
          description: Идентификатор трассировки (эхо X-Trace-Id запроса).
      x-csharp: "src/ClubShell.Contracts/Errors/ErrorCode.cs:178"
      x-source:
        - "src/ClubShell.Core/Http/ServerClient.cs:696"
        - "src/ClubShell.Core/Http/ServerClient.cs:717"
        - "src/ClubShell.Core/Http/ServerClient.cs:725"
        - "src/ClubShell.Core/Http/ServerClient.cs:843"
        - "src/ClubShell.Core/Abstractions/IServerClient.cs:73"
        - "docs/SERVER_API.md:99"
        - "docs/SERVER_API.md:239"
        - "docs/IPC_PROTOCOL.md:765"
        - "tools/MockServer/src/routes/auth.ts:62"
        - "tools/MockServer/src/routes/auth.ts:131"
        - "tools/MockServer/src/index.ts:116"

    # ------------------------------------------------------------------ Ipc/IpcErrors.cs

    IpcError:
      type: object
      description: >-
        Ошибка в формате IPC. На сервер приходит в CommandAck.error / WsAck.error, когда агент не смог выполнить
        команду (например, notFound для неизвестной команды — по WS и по REST-пути, validation при отсутствии обязательного payload,
        timeout для просроченной/вытесненной команды, internal при исключении обработчика).
      required: [code, message, details]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Сообщение на английском; UI локализует по code.
        details:
          description: >-
            Структурированные данные (C#: JsonElement?, ключ пишется всегда — JsonIgnore(Never)); null, если нет.
            Форма по коду — ErrorCode.x-details-schemas.
      x-csharp: "src/ClubShell.Contracts/Ipc/IpcErrors.cs:18"
      x-source:
        - "src/ClubShell.Core/Realtime/RealtimeClient.cs:379"
        - "src/ClubShell.Agent/Server/CommandReceiver.cs:568"
        - "docs/IPC_PROTOCOL.md:62"

    ValidationDetails:
      type: object
      description: details для validation.
      required: [field, reason]
      properties:
        field:
          type: string
          description: JSON-путь поля с ошибкой, например minutes или items[2].qty.
        reason:
          type: string
          description: Машиночитаемая причина — required, min, max, format и т.п. (набор открытый).
          examples: [required, min, max, format, enum]
      x-csharp: "src/ClubShell.Contracts/Ipc/IpcErrors.cs:155"

    ReasonDetails:
      type: object
      description: >-
        details с одним кодом причины (unauthorized, forbidden, conflict; также serverUnavailable с reason
        notImplemented для 501). Набор причин открытый; известные — x-known-values.
      required: [reason]
      properties:
        reason:
          type: string
          description: Код причины.
      x-known-values:
        unauthorized: [expired, clockSkew, userToken, revoked, reused, invalid, missing, signature, clubKey, badCredentials, qrNotConfirmed, invalidPin]
        forbidden: [pendingApproval, clubDisabled, banned, zoneNotAllowed, ageRestricted, guest, guestDisabled, notOwner, notMember, ownerOnly, pcMismatch]
        conflict: [outOfStock, slotTaken, full, alreadyJoined, notOpen, notPending, alreadyPaused, notPaused, alreadyStarted, pcBusy, activeSessionElsewhere, postpaidSession, shiftOpen, noShift]
        serverUnavailable: [notImplemented]
      x-csharp: "src/ClubShell.Contracts/Ipc/IpcErrors.cs:159"
      x-source:
        - "src/ClubShell.Core/Http/ServerClient.cs:61"
        - "docs/SERVER_API.md:40"
        - "docs/SERVER_API.md:239"
        - "tools/MockServer/src/db.ts:73"
        - "tools/MockServer/src/index.ts:116"
        - "tools/MockServer/src/routes/club.ts:205"
        - "tools/MockServer/src/routes/club.ts:225"

    RateLimitDetails:
      type: object
      description: details для rateLimited; то же значение сервер дублирует в заголовке Retry-After.
      required: [retryAfterSec]
      properties:
        retryAfterSec:
          type: integer
          format: int32
          minimum: 0
          description: Через сколько секунд можно повторить.
      x-csharp: "src/ClubShell.Contracts/Ipc/IpcErrors.cs:167"

    InsufficientFundsDetails:
      type: object
      description: details для insufficientFunds.
      required: [required, available]
      properties:
        required:
          $ref: '#/components/schemas/Money'
          description: Сколько нужно для операции.
        available:
          $ref: '#/components/schemas/Money'
          description: Сколько доступно сейчас.
      x-csharp: "src/ClubShell.Contracts/Ipc/IpcErrors.cs:172"

    PolicyDeniedDetails:
      type: object
      description: details для policyDenied.
      required: [rule]
      properties:
        rule:
          type: string
          description: Идентификатор правила политики (набор открытый).
          examples: [ageRating, alreadyRunning, postpaidNotAllowed, pcMaintenance, tariffZone, muted]
        field:
          type: [string, "null"]
          description: Поле настроек, заблокированное политикой (settings.set).
      x-csharp: "src/ClubShell.Contracts/Ipc/IpcErrors.cs:177"

    AntiCheatBlockedDetails:
      type: object
      description: details для antiCheatBlocked.
      required: [kind, reason]
      properties:
        kind:
          $ref: '#/components/schemas/AntiCheatKind'
          description: Подсистема античита.
        reason:
          type: string
          description: Непройденная проверка, например driverMissing, secureBootOff.
      x-csharp: "src/ClubShell.Contracts/Ipc/IpcErrors.cs:182"

    LaunchFailedDetails:
      type: object
      description: details для gameLaunchFailed.
      required: [stage]
      properties:
        stage:
          type: string
          description: Этап запуска — lease, inject, createProcess, waitForWindow.
        exitCode:
          type: [integer, "null"]
          format: int32
          description: Код выхода лаунчера, если он завершился.
        stderr:
          type: [string, "null"]
          description: Хвост stderr, если есть.
      x-csharp: "src/ClubShell.Contracts/Ipc/IpcErrors.cs:188"

    VersionMismatchDetails:
      type: object
      description: details для versionMismatch.
      required: [supported, got]
      properties:
        supported:
          type: array
          description: Поддерживаемые мажорные версии протокола.
          items:
            type: integer
            format: int32
        got:
          type: integer
          format: int32
          description: Полученная версия.
      x-csharp: "src/ClubShell.Contracts/Ipc/IpcErrors.cs:193"

    TraceDetails:
      type: object
      description: details для internal (и любой серверной ошибки, переданной в IPC).
      required: [traceId]
      properties:
        traceId:
          type: string
          description: Идентификатор трассировки для сопоставления логов.
      x-csharp: "src/ClubShell.Contracts/Ipc/IpcErrors.cs:197"

    # ------------------------------------------------------------------ Commands/ServerCommand.cs — обновления

    UpdateChannel:
      type: string
      enum: [stable, beta]
      description: Канал обновлений.
      x-agent-fallback: unknown
      x-csharp: "src/ClubShell.Contracts/Commands/ServerCommand.cs:17"

    UpdateComponent:
      type: string
      enum: [agent, shell]
      description: >-
        Обновляемый компонент — служба агента или киоск-шелл. Незнакомое значение агент читает как unknown и такое
        обновление отклоняет (ack команды update — validation; AgentUpdater.cs:286).
      x-agent-fallback: unknown
      x-csharp: "src/ClubShell.Contracts/Commands/ServerCommand.cs:31"

    UpdateManifest:
      type: object
      description: Описание пакета обновления (GET /updates/{channel}/manifest, payload команды update).
      required: [channel, component, version, url, sha256, size, signature, releaseNotes, mandatory, publishedAt]
      properties:
        channel:
          $ref: '#/components/schemas/UpdateChannel'
        component:
          $ref: '#/components/schemas/UpdateComponent'
        version:
          type: string
          description: Semver пакета.
        url:
          type: string
          description: HTTPS-адрес пакета (нужен тот же Bearer, поддерживается Range).
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 пакета, hex в нижнем регистре.
        size:
          type: integer
          format: int64
          description: Размер пакета, байт.
        signature:
          type: string
          contentEncoding: base64
          description: Base64 подписи RSA-PSS-SHA256 над байтами пакета.
        releaseNotes:
          type: string
          description: Примечания к выпуску (Markdown).
        mandatory:
          type: boolean
          description: Ставить даже во время сессии (после предупреждения за 60 с).
        publishedAt:
          type: string
          format: date-time
          description: Время публикации.
        minAgentVersion:
          type: [string, "null"]
          description: Минимальная версия агента (для пакетов shell).
      x-csharp: "src/ClubShell.Contracts/Commands/ServerCommand.cs:69"

    # ------------------------------------------------------------------ Commands/ServerCommand.cs — команды сервер -> агент

    ServerCommandType:
      type: string
      enum:
        - lock
        - unlock
        - message
        - reboot
        - shutdown
        - wake
        - endSession
        - extendSession
        - launchGame
        - killGame
        - setPolicy
        - reloadPolicy
        - screenshot
        - remoteControlStart
        - remoteControlStop
        - update
        - showAds
        - setVolume
        - refreshConfig
      description: >-
        Тип команды сервер -> агент (WS-кадр command, поле name; REST GET /agents/{pcId}/commands, поле name). На
        проводе name — строка (WsFrame.name, ServerCommandEnvelope.name): имя, которого агент не знает, он подтверждает
        ack { ok: false, error.code: notFound } по обоим путям. Новое имя команды безопасно для агентов с club-shell
        feat/shell-changes; у старых агентов неизвестное имя в REST-пачке роняет разбор всей пачки — такое имя
        добавлять с x-enum-added.
        Payload и результат ack по типу — x-payload-schemas / x-result-schemas (null — нет payload / результат null).
        Для команд из x-payload-optional payload может быть null или отсутствовать; для остальных без payload агент
        отвечает ack { ok: false, error.code: validation, details.field: payload }.
      x-enum-descriptions:
