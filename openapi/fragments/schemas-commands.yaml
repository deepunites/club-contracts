    ServerCommand:
      type: object
      description: >-
        Нормализованная команда внутри диспетчера агента (строится из WsFrame или ServerCommandEnvelope). По сети в
        таком виде не передаётся — описана для полноты; на проводе см. WsFrame и ServerCommandEnvelope.
      required: [id, type, issuedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор команды (ключ дедупликации, 24 ч).
        type:
          $ref: '#/components/schemas/ServerCommandType'
        issuedAt:
          type: string
          format: date-time
          description: Время выдачи на сервере.
        payload:
          description: Payload по типу (ServerCommandType.x-payload-schemas) или null.
        issuedBy:
          type: [string, "null"]
          description: Логин администратора или system.
        supersedes:
          type: [string, "null"]
          format: uuid
          description: Более ранняя ожидающая команда, которую эта отменяет.
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: После этого времени команда отбрасывается (ack с timeout).
      x-agent-internal: true
      x-csharp: "src/ClubShell.Contracts/Commands/ServerCommand.cs:156"

    ServerCommandEnvelope:
      type: object
      description: >-
        Команда в очереди, как её отдаёт GET /agents/{pcId}/commands. После выполнения агент шлёт
        POST /agents/{pcId}/commands/{id}/ack с CommandAck для каждого элемента пачки: неизвестное имя — ack
        { ok: false, error.code: notFound }, просроченная — timeout, остальные выполняются (Heartbeat.cs:318-375).
      required: [id, ts, name]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор команды.
        ts:
          type: string
          format: date-time
          description: Время выдачи на сервере.
        name:
          type: string
          description: >-
            Имя команды — значение ServerCommandType. В C# строка, как WsFrame.name (club-shell feat/shell-changes,
            SHELL_CHANGES п. 3): незнакомое имя агент подтверждает ack notFound и выполняет остальные команды пачки.
            Агенты до feat/shell-changes разбирали name как enum ServerCommandType: незнакомое имя роняло разбор всей
            пачки (protocolError), ни одна команда не выполнялась. Поэтому сервер шлёт только имена ServerCommandType,
            новые — по правилу x-enum-added.
          examples: [lock, message, reboot]
        payload:
          description: Payload по типу (ServerCommandType.x-payload-schemas); null или отсутствует, если данных нет.
        issuedBy:
          type: [string, "null"]
          description: Логин администратора (для аудита на агенте).
        supersedes:
          type: [string, "null"]
          format: uuid
          description: Более ранняя ожидающая команда, которую эта отменяет.
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Срок годности; просроченную команду агент подтверждает ack с ошибкой timeout.
      x-csharp: "src/ClubShell.Contracts/Commands/ServerCommand.cs:216"
      x-source:
        - "src/ClubShell.Contracts/Commands/ServerCommand.cs:179"
        - "src/ClubShell.Agent/Server/Heartbeat.cs:318"
        - "src/ClubShell.Agent/Server/Heartbeat.cs:361"
