            - type: "null"
          description: Тело подтверждения; обязательно для type = ack.
        supersedes:
          type: [string, "null"]
          format: uuid
          description: Только command — более ранняя ожидающая команда, которую эта отменяет.
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Только command — отбросить после этого времени (ack с timeout).
      allOf:
