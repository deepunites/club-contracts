# Группа schemas-admin: схемы кассы и настройки клуба (`apps/admin`, маршруты `/admin/*`).
# Источники: apps/admin/src/api.ts (потребитель — приоритет), tools/MockServer/src/routes/{admin,club}.ts,
# tools/MockServer/src/{club,health,control}.ts. C#-аналогов нет, поэтому у схем x-source вместо x-csharp.
# Общие типы (Money, Tariff, TariffTimeWindow, Session, Pc, PcStatus, PcMetrics, HardwareInfo, Product, Transaction,
# ShellFeatures, UserRole, LauncherType, CommandAck, OkResponse) — по C#-именам из других групп, не дублируются.
#
# Обязательность в схемах кассы (типы TypeScript, а не C#):
# - ответ: ключ TS без `?` -> required; `T | null` -> required + null (касса сравнивает строго `=== null`,
#   например MapPage.tsx:91, ControlPage.tsx:305, IntegrationsPage.tsx:238, ShiftPage.tsx:254 — пропуск ключа ломает
#   экран, поэтому null надо отдавать явно); `x?: T` -> не required.
# - запрос: required только то, что и касса шлёт всегда, и мок требует (str/int без opt*); остальное необязательно.
#   Тела PATCH с приведением к границам/слиянием в моке — отдельные схемы *Patch/*Input без required и без
#   minimum/maximum (границы — `x-clamp`), а не схемы ответа.
# Деньги в схемах кассы — либо Money, либо целое int64 в минимальных единицах (тийины), как в api.ts.
#
# Открытый вопрос (openQuestions, не норма схемы): отступление от общего правила формата «nullable -> НЕ в required».
# Для Admin-схем принято «TS `T | null` (без `?`) -> required + допускает null», потому что касса проверяет строго
# `=== null`/`!== null`, и пропущенный ключ (undefined) проходит мимо проверки: apps/admin/src/pages/ShiftPage.tsx:254
# (`s.closingCash === null`), MapPage.tsx:91 (`seat.session !== null` — без ключа свободное место выглядит занятым),
# IntegrationsPage.tsx:238 (`h.lastStatus === null`), ControlPage.tsx:305 (`e.shiftId === null`). Нужно явное утверждение владельца; альтернатива — общее правило + требование к серверу
# всегда сериализовать null (тогда касса работает, но схема этого не гарантирует).
components:
  schemas:

    # ----------------------------------------------------------------------------------------------------------------
    # Персонал, вход по PIN
    # ----------------------------------------------------------------------------------------------------------------

    AdminStaffRole:
      type: string
      enum:
        - owner
        - cashier
      description: >-
        Роль сотрудника кассы. owner — владелец: все разделы, настройки клуба, тарифы, зал, отчёты, контроль кассиров;
        cashier — кассир: касса, смена, клиенты (без чёрного списка), приёмка товара, тикеты ремонта. Какие маршруты
        требуют какую роль — `x-roles` операций.
      x-source:
        - apps/admin/src/api.ts:156
        - tools/MockServer/src/club.ts:33
        - tools/MockServer/src/routes/club.ts:63

    AdminStaffMember:
      type: object
      description: Сотрудник кассы (без PIN).
      required:
        - id
        - name
        - role
        - active
      properties:
        id:
          type: string
          description: >-
            Идентификатор сотрудника, непрозрачная строка (в моке у демо-записей `owner`, `cashier-1`, у новых — UUID).
        name:
          type: string
          maxLength: 64
          description: Имя для экрана и журнала.
        role:
          $ref: '#/components/schemas/AdminStaffRole'
        active:
          type: boolean
          description: >-
            Может входить по PIN. У отключённого сотрудника все выданные токены перестают действовать (мок проверяет
            `active` на каждом запросе). В ответах `POST /admin/login` и `GET /admin/me` мок поле не отдаёт — сервер
            отдаёт `true`.
      x-source:
        - apps/admin/src/api.ts:157
        - tools/MockServer/src/club.ts:35
        - tools/MockServer/src/routes/club.ts:144
        - tools/MockServer/src/routes/club.ts:154

