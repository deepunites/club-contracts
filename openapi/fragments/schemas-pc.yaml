    AgentServerConfig:
      type: object
      description: |-
        Серверные переопределения конфигурации ПК: ответ GET /agents/{pcId}/config (SERVER_API §4.1) и поле
        config в ответе POST /agents/register (агент его не применяет, только сохраняет pcId).
        Когда агент запрашивает: после первого heartbeat, при каждой смене HeartbeatResponse.configVersion и по
        команде refreshConfig; If-None-Match для config не шлёт (всегда ждёт 200). Агент с club-shell
        feat/shell-changes (SHELL_CHANGES п. 8) сохраняет последний применённый конфиг целиком в
        <paths.cache>/server-config.json и применяет его при старте службы, до первого heartbeat
        (SettingsLoader.cs:504): серверные настройки (storage.gamesShare, флаги фич, wsUrl и прочие) действуют с
        загрузки. Старые агенты держали переопределения только в памяти: до первого heartbeat действовал чистый
        agent.json.
        Как применяет (CommandReceiver.RefreshServerConfigAsync → SettingsLoader.ApplyServerOverrides →
        SettingsJson.FromServerConfig):
        1) блок shell пишется в shell.json (см. ShellConfigOverride) — первым и отдельно от оверлея agent.json;
        2) из pcName, zone, session, offline, games, storage, telemetry, remoteAdmin, anticheat, updates и wsUrl
           (→ server.wsUrl) строится оверлей agent.json; разделы-JsonElement берутся, только если это JSON-объект;
        3) глубокое слияние поверх agent.json: объекты сливаются рекурсивно, массивы/скаляры/null заменяют,
           ключи сравниваются без учёта регистра; незнакомые ключи игнорируются;
        4) результат читается как AgentSettings (AppSettings.cs) и валидируется (диапазоны, обязательные строки,
           URL). Любая ошибка типа/диапазона отвергает ВЕСЬ оверлей agent.json (остаётся прежний снимок) и не пишется
           в кэш.
        Умолчания агента club-shell feat/shell-changes для функций, которым нужны эндпоинты сервера, выключены до
        включения сервером (SHELL_CHANGES п. 4, 5, 12): games.accountPool.enabled, games.cloudSave.enabled и
        remoteAdmin.allowRemoteInput — false; флаги features — см. ShellConfigOverride.features.
        Поля number и themes агент сейчас не использует; секреты (пароли шары и т.п.) в конфиге не передаются.
