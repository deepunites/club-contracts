          type: string
          description: Имя ПК; перекрывает agent.json → pcName (пустая строка — не менять).
        zone:
          type: string
          description: Зона; перекрывает agent.json → zone (пустая строка — не менять).
        number:
          type: integer
          format: int32
          description: Номер места (агентом не применяется).
        session:
