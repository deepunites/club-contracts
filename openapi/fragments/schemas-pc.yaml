# Группа schemas-pc: публичные типы из
#   src/ClubShell.Contracts/Pc/HardwareInfo.cs, Pc/PcStatus.cs, Pc/PcInfo.cs (namespace ClubShell.Contracts.Pcs).
# Внешние схемы (определяют другие группы, здесь только $ref): UpdateChannel, AntiCheatKind, Locale.
# Правила провода: JsonDefaults.cs — camelCase, enum как camelCase-строки (CamelCaseEnumConverter; у enum с
# x-agent-fallback: unknown агент с club-shell feat/shell-changes читает незнакомую строку как unknown),
# null не пишется (WhenWritingNull), незнакомые поля пропускаются, DateTimeOffset -> yyyy-MM-ddTHH:mm:ss.fffZ,
# TimeOnly -> HH:mm (ClubTimeConverter). В этих файлах нет JsonPropertyName/JsonIgnore/JsonPolymorphic.
components:
  schemas:

    # ------------------------------------------------------------------ HardwareInfo.cs

    DiskType:
      type: string
      enum: [hdd, ssd, nvme, network, unknown]
      description: >-
        Физический тип диска (unknown — не удалось определить). Незнакомую строку агент с club-shell
        feat/shell-changes тоже читает как unknown (здесь unknown — обычное значение enum).
      x-agent-fallback: unknown
      x-csharp: "src/ClubShell.Contracts/Pc/HardwareInfo.cs:8"

    PeripheralKinds:
      type: string
      description: >-
        Известные значения PeripheralInfo.kind. В C# это статический класс строковых констант, а не enum:
        набор открытый, сервер обязан принимать любую строку.
      examples: [keyboard, mouse, headset, gamepad, other]
      x-known-values: [keyboard, mouse, headset, gamepad, other]
      x-csharp: "src/ClubShell.Contracts/Pc/HardwareInfo.cs:27"

    CpuInfo:
      type: object
      description: Процессор.
      required: [model, cores, threads]
      properties:
        model:
          type: string
          description: Модель из SMBIOS/WMI.
        cores:
          type: integer
          format: int32
          description: Физические ядра.
        threads:
          type: integer
          format: int32
          description: Логические процессоры.
      x-csharp: "src/ClubShell.Contracts/Pc/HardwareInfo.cs:49"

    GpuInfo:
      type: object
      description: Видеокарта.
      required: [model, vramMb, driver]
      properties:
        model:
          type: string
          description: Модель адаптера.
        vramMb:
          type: integer
          format: int32
          description: Выделенная видеопамять, МиБ.
        driver:
          type: string
          description: Версия драйвера.
      x-csharp: "src/ClubShell.Contracts/Pc/HardwareInfo.cs:58"

    DiskInfo:
      type: object
      description: Логический диск.
      required: [mount, totalGb, freeGb, type]
      properties:
        mount:
          type: string
          description: Точка монтирования, например "C:".
        totalGb:
          type: number
          format: double
          description: Ёмкость, ГБ (1 знак после запятой).
        freeGb:
          type: number
          format: double
          description: Свободно, ГБ (1 знак после запятой).
        type:
          $ref: '#/components/schemas/DiskType'
      x-csharp: "src/ClubShell.Contracts/Pc/HardwareInfo.cs:68"

    MonitorInfo:
      type: object
      description: Подключённый монитор.
      required: [index, width, height, hz, primary]
      properties:
        index:
          type: integer
          format: int32
          description: Индекс дисплея (с 0).
        width:
          type: integer
          format: int32
          description: Ширина, px.
        height:
          type: integer
          format: int32
          description: Высота, px.
        hz:
          type: integer
          format: int32
          description: Частота обновления, Гц.
        primary:
          type: boolean
          description: Основной дисплей.
      x-csharp: "src/ClubShell.Contracts/Pc/HardwareInfo.cs:80"

    NetworkInfo:
      type: object
      description: Основной сетевой адаптер.
      required: [mac, ip, adapter]
      properties:
        mac:
          type: string
          description: MAC-адрес в виде AA:BB:CC:DD:EE:FF.
        ip:
          type: string
          description: IPv4-адрес.
        adapter:
          type: string
          description: Имя адаптера.
      x-csharp: "src/ClubShell.Contracts/Pc/HardwareInfo.cs:91"

    OsInfo:
      type: object
      description: Операционная система.
      required: [version, build]
      properties:
        version:
          type: string
          description: Название продукта, например "Windows 11 Pro".
        build:
          type: string
          description: Сборка, например "26200.1234".
      x-csharp: "src/ClubShell.Contracts/Pc/HardwareInfo.cs:99"

    PeripheralInfo:
      type: object
      description: USB/HID-периферия.
      required: [kind, name, vendorId, productId]
      properties:
        kind:
          $ref: '#/components/schemas/PeripheralKinds'
          description: Вид устройства (см. PeripheralKinds; набор открытый).
        name:
          type: string
          description: Имя устройства.
        vendorId:
          type: string
          description: USB vendor id (hex).
        productId:
          type: string
          description: USB product id (hex).
      x-csharp: "src/ClubShell.Contracts/Pc/HardwareInfo.cs:108"

    HardwareInfo:
      type: object
      description: >-
        Инвентаризация железа ПК (IPC_PROTOCOL §6.6). Агент шлёт при регистрации (AgentRegisterRequest.hardware)
        и при изменении (телеметрия, событие hardwareChanged).
      required: [cpu, gpu, ramMb, disks, monitors, network, os, peripherals]
      properties:
        cpu:
          $ref: '#/components/schemas/CpuInfo'
        gpu:
          type: array
          description: Видеокарты.
          items:
            $ref: '#/components/schemas/GpuInfo'
        ramMb:
          type: integer
          format: int32
          description: Установленная ОЗУ, МиБ.
        disks:
          type: array
          description: Логические диски.
          items:
            $ref: '#/components/schemas/DiskInfo'
        monitors:
          type: array
          description: Мониторы.
          items:
            $ref: '#/components/schemas/MonitorInfo'
        network:
          $ref: '#/components/schemas/NetworkInfo'
        os:
          $ref: '#/components/schemas/OsInfo'
        peripherals:
          type: array
          description: Периферия.
          items:
            $ref: '#/components/schemas/PeripheralInfo'
      x-csharp: "src/ClubShell.Contracts/Pc/HardwareInfo.cs:123"

    # ------------------------------------------------------------------ PcStatus.cs

    PcStatus:
      type: string
      enum: [offline, free, busy, locked, maintenance, booked]
      description: >-
        Статус места/ПК на карте клуба: offline — агент недоступен; free — онлайн без сессии; busy — идёт сессия;
        locked — сессия заблокирована или блокировка админом; maintenance — выведен из работы; booked — забронирован.
      x-agent-fallback: unknown
      x-csharp: "src/ClubShell.Contracts/Pc/PcStatus.cs:8"

    Temperatures:
      type: object
      description: Температуры, °C; 0 — недоступно.
      required: [cpu, gpu]
      properties:
        cpu:
          type: number
          format: double
          description: Температура пакета CPU.
        gpu:
          type: number
          format: double
          description: Температура GPU.
      x-csharp: "src/ClubShell.Contracts/Pc/PcStatus.cs:43"

    NetworkThroughput:
      type: object
      description: Сетевой трафик, Мбит/с.
      required: [up, down]
      properties:
        up:
          type: number
          format: double
          description: Отдача.
        down:
          type: number
          format: double
          description: Приём.
      x-csharp: "src/ClubShell.Contracts/Pc/PcStatus.cs:50"

    PcMetrics:
      type: object
      description: >-
        Одна выборка телеметрии (IPC_PROTOCOL §6.7): payload sys.metrics и элемент samples в
        POST /agents/{pcId}/telemetry (до 120 за пакет).
      required: [cpuPct, gpuPct, ramUsedMb, temps, netMbps, uptimeSec, at]
      properties:
        cpuPct:
          type: number
          format: double
          description: Загрузка CPU, 0–100.
        gpuPct:
          type: number
          format: double
          description: Загрузка GPU, 0–100; 0 — недоступно.
        ramUsedMb:
          type: integer
          format: int32
          description: Занятая ОЗУ, МиБ.
        temps:
          $ref: '#/components/schemas/Temperatures'
        fps:
          type: [number, "null"]
          format: double
          description: FPS из оверлей-хука запущенной игры; нет игры — поле отсутствует/null.
        netMbps:
          $ref: '#/components/schemas/NetworkThroughput'
        uptimeSec:
          type: integer
          format: int64
          description: Аптайм ОС, секунды.
        at:
          type: string
          format: date-time
          description: Время выборки (UTC, yyyy-MM-ddTHH:mm:ss.fffZ).
      x-csharp: "src/ClubShell.Contracts/Pc/PcStatus.cs:63"

    # ------------------------------------------------------------------ PcInfo.cs — Pc

    Pc:
      type: object
      description: Игровой ПК в представлении сервера (IPC_PROTOCOL §6.5).
      required: [id, name, zone, number, ipAddress, status, agentVersion, shellVersion, lastHeartbeatAt]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор ПК.
        name:
          type: string
          description: Имя, например "PC-12".
        zone:
          type: string
          description: Зона, например "VIP", "Standard", "Bootcamp".
        number:
          type: integer
          format: int32
          description: Номер места.
        hwid:
          type: [string, "null"]
          description: >-
            Hardware id (sha256 hex). Отдаётся только для собственного ПК вызывающего агента; для чужих ПК
            в GET /pcs опускается (мок шлёт null — допустимо).
        ipAddress:
          type: string
          description: IPv4-адрес.
        status:
          $ref: '#/components/schemas/PcStatus'
        currentSessionId:
          type: [string, "null"]
          format: uuid
          description: Открытая сессия, если есть.
        agentVersion:
          type: string
          description: Версия агента (semver).
        shellVersion:
          type: string
          description: Версия шелла (semver); "0.0.0", если неизвестна.
        lastHeartbeatAt:
          type: string
          format: date-time
          description: Последний heartbeat, полученный сервером.
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:24"

    PcsResponse:
      type: object
      description: Ответ GET /pcs.
      required: [items]
      properties:
        items:
          type: array
          description: ПК клуба (опционально отфильтрованные по зоне).
          items:
            $ref: '#/components/schemas/Pc'
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:39"

    # ------------------------------------------------------------------ PcInfo.cs — Policy

    AllowlistMode:
      type: string
      enum: [allow, deny]
      description: 'Семантика ProcessAllowlistPolicy.patterns — allow: запускаться могут только совпавшие процессы; deny: совпавшие убиваются.'
      x-agent-fallback: unknown
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:68"

    ShellReplacementPolicy:
      type: object
      description: Замена оболочки (explorer.exe) для киоск-пользователя.
      required: [enabled, shellExe]
      properties:
        enabled:
          type: boolean
          description: Заменять explorer.exe.
        shellExe:
          type: string
          description: Путь к исполняемому файлу шелла; при enabled=true непустой (иначе агент отвергает политику).
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:80"

    ProcessAllowlistPolicy:
      type: object
      description: Allow/deny-список процессов; шаблоны — wildcard по имени образа ("*cheat*").
      required: [mode, patterns]
      properties:
        mode:
          $ref: '#/components/schemas/AllowlistMode'
        patterns:
          type: array
          description: Wildcard-шаблоны.
          items:
            type: string
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:87"

    UsbPolicy:
      type: object
      description: Политика USB-устройств.
      required: [allowStorage, allowHid]
      properties:
        allowStorage:
          type: boolean
          description: Разрешить USB-накопители.
        allowHid:
          type: boolean
          description: Разрешить USB HID.
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:94"

    WebFilterPolicy:
      type: object
      description: >-
        DNS-фильтр веба. Защищённые домены никогда не блокируются, и их адреса исключаются из правил брандмауэра:
        встроенный список агента (лаунчеры, античиты), protectedDomains и хост server.baseUrl
        (WebFilterPolicy.cs:65). Защищён сам домен и все его поддомены.
      required: [enabled, blockedDomains, allowedDomains, dnsServers]
      properties:
        enabled:
          type: boolean
          description: Фильтр включён.
        blockedDomains:
          type: array
          description: Блокируемые домены (wildcard).
          items:
            type: string
        allowedDomains:
          type: array
          description: Непустой список — режим allow-list.
          items:
            type: string
        dnsServers:
          type: array
          description: Принудительные фильтрующие DNS-резолверы.
          items:
            type: string
        blockResolvedIps:
          type: [boolean, "null"]
          description: >-
            Дополнительно закрывать брандмауэром публичные IPv4, в которые резолвятся blockedDomains. null или нет поля —
            false (club-shell feat/shell-changes, SHELL_CHANGES п. 13): заблокированный сайт на общем адресе CDN
            (Cloudflare, Akamai, Fastly) иначе отрезает и лаунчеры. Старые агенты поле не знают и закрывают адреса
            всегда.
          x-source:
            - "src/ClubShell.Agent/Policy/WebFilterPolicy.cs:118"
        protectedDomains:
          type: [array, "null"]
          description: >-
            Домены, которые не блокируются никогда, в дополнение к встроенному списку агента (домен и поддомены;
            ведущие "*." и "." отбрасываются, не-имена хостов игнорируются). null или нет поля — только встроенный
            список и хост server.baseUrl. Старые агенты поле не знают.
          items:
            type: string
          x-source:
            - "src/ClubShell.Windows/Network/DnsFilter.cs:147"
            - "src/ClubShell.Windows/Network/DnsFilter.cs:171"
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:114"
      x-source:
        - "src/ClubShell.Agent/Policy/WebFilterPolicy.cs:65"

    ExplorerPolicy:
      type: object
      description: >-
        Блокировка Explorer/ввода. Комбинации клавиш: модификаторы Ctrl|Alt|Shift|Win через "+", затем имя клавиши —
        имя Win32 virtual-key без VK_ или алиас (Esc, Del, Enter, PgUp, PgDn, PrintScreen), напр. "Ctrl+Shift+Esc",
        "Win+R", "Alt+F4" (парсер — src/ClubShell.Windows/Hooks/BlockedKeyCombos.cs).
      required: [disableTaskManager, disableRun, disableSettings, hideTaskbar, disableAltTab, disableWinKey, blockedKeyCombos]
      properties:
        disableTaskManager:
          type: boolean
          description: Отключить диспетчер задач.
        disableRun:
          type: boolean
          description: Отключить диалог «Выполнить».
        disableSettings:
          type: boolean
          description: Отключить Параметры/Панель управления.
        hideTaskbar:
          type: boolean
          description: Скрыть панель задач.
        disableAltTab:
          type: boolean
          description: Блокировать Alt+Tab.
        disableWinKey:
          type: boolean
          description: Блокировать клавишу Windows.
        blockedKeyCombos:
          type: array
          description: Дополнительно блокируемые комбинации, напр. "Ctrl+Shift+Esc".
          items:
            type: string
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:120"

    PowerPolicy:
      type: object
      description: Политика питания.
      properties:
        idleShutdownMin:
          type: [integer, "null"]
          format: int32
          description: Выключать после стольких минут простоя; null/нет поля — никогда.
        scheduledShutdown:
          type: [string, "null"]
          pattern: '^\d{2}:\d{2}$'
          description: Ежедневное выключение, местное время клуба HH:mm; null/нет поля — нет.
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:132"

    UpdatesPolicy:
      type: object
      description: Политика обновлений (перекрывает agent.json → updates).
      required: [channel, autoInstall]
      properties:
        channel:
          $ref: '#/components/schemas/UpdateChannel'
        autoInstall:
          type: boolean
          description: Ставить скачанные обновления автоматически в простое.
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:139"

    AntiCheatPolicy:
      type: object
      description: Политика античита.
      required: [required, blockOnViolation]
      properties:
        required:
          type: array
          description: Подсистемы, драйверы/службы которых обязаны быть исправны.
          items:
            $ref: '#/components/schemas/AntiCheatKind'
        blockOnViolation:
          type: boolean
          description: Блокировать запуски / сессию при нарушениях.
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:146"

    KioskPolicy:
      type: object
      description: Политика киоск-интерфейса.
      required: [idleTimeoutSec, adsIntervalSec, allowVirtualKeyboard]
      properties:
        idleTimeoutSec:
          type: integer
          format: int32
          description: Таймаут блокировки по простою, с.
        adsIntervalSec:
          type: integer
          format: int32
          description: Интервал между рекламными паузами, с.
        allowVirtualKeyboard:
          type: boolean
          description: Разрешить экранную клавиатуру.
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:154"

    Policy:
      type: object
      description: >-
        Применяемая политика ПК (IPC_PROTOCOL §6.18, ARCHITECTURE §12.3) — ответ GET /agents/{pcId}/policies,
        снимок в policies.json. Все секции обязательны: документ без любой из них агент отвергает (PolicyStore.Validate).
        Агент перезапрашивает политику, когда HeartbeatResponse.policyVersion новее применённой; файл никогда не
        заменяет уже известную более высокую версию.
      required: [version, updatedAt, shellReplacement, processAllowlist, usb, webFilter, explorer, power, updates, anticheat, kiosk]
      properties:
        version:
          type: integer
          format: int32
          minimum: 0
          description: Монотонная версия, назначает сервер.
        updatedAt:
          type: string
          format: date-time
          description: Время последнего изменения.
        shellReplacement:
          $ref: '#/components/schemas/ShellReplacementPolicy'
        processAllowlist:
          $ref: '#/components/schemas/ProcessAllowlistPolicy'
        usb:
          $ref: '#/components/schemas/UsbPolicy'
        webFilter:
          $ref: '#/components/schemas/WebFilterPolicy'
        explorer:
          $ref: '#/components/schemas/ExplorerPolicy'
        power:
          $ref: '#/components/schemas/PowerPolicy'
        updates:
          $ref: '#/components/schemas/UpdatesPolicy'
        anticheat:
          $ref: '#/components/schemas/AntiCheatPolicy'
          description: Политика античита (ключ на проводе — anticheat, в нижнем регистре).
        kiosk:
          $ref: '#/components/schemas/KioskPolicy'
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:171"
      x-source:
        - "src/ClubShell.Agent/Policy/PolicyStore.cs:78"
        - "config/policies.example.json:1"

    # ------------------------------------------------------------------ PcInfo.cs — Theme

    ThemeColors:
      type: object
      description: 'Палитра темы; каждое значение — #RRGGBB или #RRGGBBAA.'
      required: [bg, surface, primary, accent, text, muted, danger, success]
      properties:
        bg:
          type: string
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          description: Фон страницы.
        surface:
          type: string
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          description: Фон карточек/панелей.
        primary:
          type: string
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          description: Цвет основного действия.
        accent:
          type: string
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          description: Акцентный цвет.
        text:
          type: string
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          description: Основной текст.
        muted:
          type: string
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          description: Второстепенный текст.
        danger:
          type: string
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          description: Ошибки/деструктивные действия.
        success:
          type: string
          pattern: '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          description: Успех.
      x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:230"

    Theme:
      type: object
      description: Файл темы шелла themes\<name>.json (ARCHITECTURE §12.4) — содержимое, скачиваемое по ThemeRef.url.
      required: [version, name, displayName, colors, radius, font, blur, animations]
      properties:
        version:
          type: integer
          format: int32
          description: Версия схемы файла (1).
        name:
          type: string
          description: Идентификатор темы; равен имени файла без расширения.
        displayName:
          type: string
          description: Название для людей.
        colors:
          $ref: '#/components/schemas/ThemeColors'
        radius:
          type: integer
          format: int32
          description: Радиус скругления, px.
        font:
          type: string
          description: Установленное семейство шрифтов; запасной — system-ui.
        backgroundVideo:
          type: [string, "null"]
