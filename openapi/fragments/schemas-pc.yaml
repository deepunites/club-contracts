        storage:
          description: |-
            Частичный agent.json → storage (C#: JsonElement? — любое JSON-значение; в оверлей идёт только объект,
            прочее, включая null, игнорируется, SettingsLoader.cs:198). Рекомендуемая форма — StorageSettings →
            GamesShareSettings из AppSettings.cs.
            Как применяет агент с club-shell feat/shell-changes (GamesShareMounter, SHELL_CHANGES п. 7-9):
            - установлен ClubDisklessHelper (club-shell docs/DISKLESS.md) — том библиотеки ведёт он, агент
              storage.gamesShare не применяет (heartbeat gamesVolume.owner = disklessHelper);
            - иначе агент подписан на смену настроек: enabled, uncPath, driveLetter, credentialsRef и mountRetries с
              сервера действуют сразу, без перезапуска службы. При смене uncPath или driveLetter старая буква
              отключается немедленно, даже если с тома запущена игра, поэтому новые пути публиковать между сессиями;
            - исправное подключение только проверяется (каждые 30 с), а не переподключается; остановка, перезапуск и
              обновление службы диск не отключают;
            - iscsi != null — агент ничего не монтирует (fail closed) и пишет ошибку в лог: игровой том по iSCSI
              (только чтение) — работа ClubDisklessHelper;
            - серверный конфиг кэшируется на диске и применяется с загрузки (см. описание AgentServerConfig).
            Учётные данные шары с сервера не передаются: credentialsRef — путь к локальному DPAPI-файлу
            { username, password } на ПК. Мок шлёт storage: null. Старые агенты: enabled читался один раз при старте
            службы, iscsi монтировался, при остановке службы диск отключался.
          x-csharp: "src/ClubShell.Contracts/Pc/PcInfo.cs:382"
          x-agent-shape: "src/ClubShell.Core/Configuration/AppSettings.cs:531"
          x-source:
            - "src/ClubShell.Core/Configuration/SettingsLoader.cs:180"
            - "src/ClubShell.Core/Configuration/SettingsLoader.cs:504"
            - "src/ClubShell.Core/Configuration/SettingsLoader.cs:540"
            - "src/ClubShell.Agent/Storage/GamesShareMounter.cs:105"
            - "src/ClubShell.Agent/Storage/GamesShareMounter.cs:129"
            - "src/ClubShell.Agent/Storage/GamesShareMounter.cs:137"
            - "src/ClubShell.Agent/Storage/GamesShareMounter.cs:220"
            - "src/ClubShell.Agent/Storage/GamesShareMounter.cs:442"
          properties:
            gamesShare:
              type: object
              description: Сетевое хранилище игр — SMB-шара (storage.gamesShare).
              x-csharp: "src/ClubShell.Core/Configuration/AppSettings.cs:539"
              properties:
                enabled:
                  type: boolean
                  description: >-
                    Подключать SMB-шару. С сервера включается и выключается сразу (агент подписан на смену настроек).
                    Старые агенты читали флаг один раз при старте службы, до серверного конфига.
                  x-csharp: "src/ClubShell.Core/Configuration/AppSettings.cs:542"
                  x-source:
                    - "src/ClubShell.Agent/Storage/GamesShareMounter.cs:442"
                uncPath:
                  type: string
                  description: 'UNC-путь SMB-шары, напр. \\nas01\games (в JSON обратные слэши экранируются).'
                  examples: ['\\nas01\games']
                  x-csharp: "src/ClubShell.Core/Configuration/AppSettings.cs:545"
                driveLetter:
                  type: string
                  minLength: 1
                  maxLength: 1
                  description: Буква диска (один символ, A–Z; по умолчанию G).
                  x-csharp: "src/ClubShell.Core/Configuration/AppSettings.cs:549"
                credentialsRef:
                  type: string
                  description: >-
                    Путь (относительно ProgramData) к DPAPI-файлу { username, password } на ПК. Пусто — без учётных
                    данных. Обычно не переопределять.
                  x-csharp: "src/ClubShell.Core/Configuration/AppSettings.cs:552"
                mountRetries:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 20
                  description: >-
                    Порог неудачных попыток подряд, после которого агент пишет ошибку в лог. Это не лимит: цикл
                    монтирования повторяет попытки бесконечно (backoff 5 с → 2 мин). Вне диапазона 1–20 весь оверлей
                    отвергается.
                  x-csharp: "src/ClubShell.Core/Configuration/AppSettings.cs:556"
                  x-source:
                    - "src/ClubShell.Agent/Storage/GamesShareMounter.cs:288"
                iscsi:
                  type: [object, "null"]
                  description: >-
                    Устаревший слот iSCSI. Агент с club-shell feat/shell-changes iSCSI не монтирует: любое значение,
                    кроме null, — агент не подключает ничего (fail closed) и пишет ошибку; игровой том по iSCSI ведёт
                    ClubDisklessHelper. Ключ разбирается, чтобы старые файлы проходили валидацию. null — SMB.
                  x-csharp: "src/ClubShell.Core/Configuration/AppSettings.cs:563"
                  properties:
                    portal:
                      type: string
                      minLength: 1
                      description: Портал host[:port]; агент только пишет его в лог.
                      x-csharp: "src/ClubShell.Core/Configuration/AppSettings.cs:570"
                    targetIqn:
                      type: string
                      minLength: 1
                      description: IQN таргета; агент только пишет его в лог.
                      x-csharp: "src/ClubShell.Core/Configuration/AppSettings.cs:573"
                    readOnly:
                      type: boolean
                      deprecated: true
                      description: >-
                        Не читается агентом с club-shell feat/shell-changes (ключ пропускается). У старых агентов —
                        пометить диски таргета только для чтения после логина.
