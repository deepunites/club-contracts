# Группа paths-catalog-commerce: клиентские вызовы агента /games*, /apps, /wallet/*, /tariffs, /shop/*, /chat/*,
# /booking/*, /tournaments*.
# Источники: src/ClubShell.Core/Http/Endpoints.cs, src/ClubShell.Core/Abstractions/IServerClient.cs,
# src/ClubShell.Core/Http/ServerClient.cs, docs/SERVER_API.md §4.6–4.12,
# tools/MockServer/src/routes/{games,wallet,shop,chat}.ts (booking и tournaments в моке живут в chat.ts).
# Приоритет при расхождении: C# агента > MockServer > SERVER_API.md.
# Режим авторизации — по AuthMode в ServerClient.cs: Agent -> agentBearer + подпись; User -> agentBearer + подпись +
# X-User-Token, но агент добавляет X-User-Token, только если на ПК вошёл пользователь (ServerClient.cs:836). Там, где
# сервер лишь обогащает ответ пользователем (мок: optionalUser), security перечисляет обе альтернативы.
# Схемы тел и ответов определяют группы schemas-*; здесь только $ref.
paths:

  # ------------------------------------------------------------------------------------------------------------------
  # /games*, /apps
  # ------------------------------------------------------------------------------------------------------------------

  /games:
    get:
      tags:
        - games
      operationId: getGames
      summary: Каталог игр (ETag, страницы)
      description: |
        Каталог игр клуба для зоны. Скрытые владельцем игры исключены, порядок — заданный владельцем (мок: `club().catalog`).

        - Агент (`GameLibrary.RefreshAsync`) запрашивает `page=1&pageSize=500`, затем догружает страницы 2..N (всегда
          без `If-None-Match`), пока не наберёт `total`. При старте (`LoadAsync`, `force: false`) первая страница идёт
          с `If-None-Match`; на `304` агент оставляет кэш (`cache\games.json`) и остальные страницы не запрашивает.
          Поэтому `ETag` (и `catalogVersion`) обязаны меняться при любом изменении каталога зоны, а не только первой
          страницы. По команде `refreshConfig` с `games` (или без флагов — «всё») агент делает принудительную
          перезагрузку (`force: true`): ETag сбрасывается, `If-None-Match` не шлётся, сервер отдаёт полный `200`.
        - Без `page` и `pageSize` — весь каталог одной страницей (`page = 1`, `pageSize = total`). `pageSize` — до 1000
          (общий максимум 200 сюда не относится); только `page` — `pageSize` по умолчанию 1000 (мок). Значения вне
          диапазона сервер не отклоняет (`400` нет), а нормализует, как общая пагинация (base §7).
        - `X-User-Token` необязателен (агент шлёт его, если пользователь вошёл): с ним сервер заполняет `lastPlayedAt`,
          без него — `null`. Недействительный токен здесь не даёт `401` — ответ как без пользователя (мок). `ETag` должен
          учитывать `lastPlayedAt`, раз представление зависит от пользователя.
        - Локальные поля `Game` сервер не знает: `installed = false`, `installPath = null`; агент перезаписывает их по
          своему сканированию.
        - `zone` — фильтр каталога по зоне ПК (`agent.json → zone`); мок параметр принимает, но не фильтрует.
        GET повторяется агентом на 408/425/429/5xx; при ошибке агент отдаёт шеллу закэшированный каталог.
      x-server-status: required
      x-source:
        - src/ClubShell.Core/Http/Endpoints.cs:51
        - src/ClubShell.Core/Abstractions/IServerClient.cs:213
        - src/ClubShell.Core/Http/ServerClient.cs:340
        - src/ClubShell.Core/Http/ServerClient.cs:659
        - src/ClubShell.Agent/Games/GameLibrary.cs:23
        - src/ClubShell.Agent/Games/GameLibrary.cs:67
        - src/ClubShell.Agent/Games/GameLibrary.cs:89
        - src/ClubShell.Agent/Games/GameLibrary.cs:91
        - src/ClubShell.Agent/Games/GameLibrary.cs:104
        - src/ClubShell.Agent/Games/GameLibrary.cs:148
        - docs/SERVER_API.md:26
        - docs/SERVER_API.md:305
        - tools/MockServer/src/routes/games.ts:60
        - tools/MockServer/src/routes/games.ts:75
        - tools/MockServer/src/db.ts:289
        - tools/MockServer/src/db.ts:461
      security:
        - agentBearer: []
          userToken: []
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/XAgentVersion'
        - $ref: '#/components/parameters/XShellVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: zone
          in: query
          required: false
          description: Зона ПК (`VIP`, `Standard`, …); нет — каталог без фильтра по зоне.
          schema:
            type: string
          example: VIP
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          required: false
          description: >-
            Размер страницы, максимум 1000 (не общий 200); агент всегда шлёт 500. Нет ни `page`, ни `pageSize` — весь
            каталог одной страницей; есть только `page` — 1000. Вне диапазона `400` нет, сервер нормализует (как мок,
            `paginate(..., 1000)`): больше 1000 → 1000; < 0 → 1; 0 или не число → 50 (общее значение по умолчанию).
            Применённое значение — в `pageSize` ответа.
          schema:
            type: integer
            format: int32
          example: 500
      responses:
        '200':
          description: Страница каталога.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesListResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /games/{id}:
    parameters:
      - name: id
        in: path
        required: true
