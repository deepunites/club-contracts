        - $ref: '#/components/parameters/XSignature'
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/XAgentVersion'
        - $ref: '#/components/parameters/XShellVersion'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: sessionId
          in: query
          required: true
          description: Открытая сессия пользователя, для которой берётся аренда.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Аренда выдана (или возвращена действующая аренда этого пользователя на эту игру).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLease'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
