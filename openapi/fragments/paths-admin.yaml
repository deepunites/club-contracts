# Группа paths-admin: бэкенд кассы и настройки клуба (`apps/admin`), все маршруты `/admin/*`.
# Источники: apps/admin/src/api.ts (потребитель; приоритет), tools/MockServer/src/routes/admin.ts (касса),
# tools/MockServer/src/routes/club.ts (настройка клуба), логика — tools/MockServer/src/{club,health,control}.ts.
# 41 маршрут мока = 41 функция api.ts (adminApi + clubApi), расхождений по набору маршрутов нет.
#
# Общее для всех операций группы:
# - Авторизация `staff`: `Authorization: Bearer <токен персонала>` из `POST /admin/login` (или ключ API клуба `ck_…`,
#   который действует как токен владельца). Подписи, X-Agent-Version и лимита запросов у кассы нет (мок исключает
#   `/api/v1/admin` из проверок агента: index.ts:79). Нет/неверный токен, сотрудник отключён — 401 `unauthorized`,
#   `details.reason = "invalid"`; не хватает роли — 403 `forbidden`, `details.reason = "ownerOnly"`. Роли — `x-roles`.
# - Касса на любой 401 (кроме `POST /admin/login`) сбрасывает токен и выходит — 401 только для проблем авторизации.
# - Касса на любой 2xx вызывает `res.json()` (api.ts:112): у каждого успешного ответа должно быть JSON-тело,
#   204 без тела ломает кассу. Изменяющие маршруты без результата отдают `OkResponse` `{ "ok": true }`.
# - Касса — браузерное приложение на другом origin: сервер обязан отвечать на CORS (preflight с `Authorization`,
#   `Content-Type`), как мок (`@fastify/cors`, origin: true, index.ts:236).
# - Касса всегда шлёт `Content-Type: application/json`, в том числе у GET/DELETE без тела; пустое тело = null.
# - Касса `Idempotency-Key` не шлёт; создающие/денежные POST принимают его необязательно (`IdempotencyKeyOptional`).
# - Статус успеха — 200, кроме `POST /admin/sessions` (201); касса проверяет только `res.ok`.
paths:

  # ------------------------------------------------------------------------------------------------------------------
  # Вход персонала
  # ------------------------------------------------------------------------------------------------------------------

  /admin/login:
    post:
      tags:
        - admin
      operationId: adminLogin
      summary: Вход персонала по PIN
      description: |
        Выдаёт токен персонала по PIN активного сотрудника. Режим `none` (токена ещё нет). Ответ — токен, сотрудник и
        открытая смена клуба. Касса хранит токен в localStorage и шлёт как `Authorization: Bearer`. Выхода (logout) в
        контракте нет: касса просто забывает токен; токен перестаёт действовать при отключении сотрудника.

        Ошибки: неверный PIN — `401 unauthorized`, `details.reason = "invalidPin"` (касса на 401 этого маршрута не
        выходит, а показывает ошибку).
      x-open-question: >-
        Ограничение попыток входа. Мок попытки не ограничивает (tools/MockServer/src/routes/club.ts:136-145) и исключает
        `/api/v1/admin` из лимита запросов агента (tools/MockServer/src/index.ts:79-81), а PIN — 4–8 цифр, т.е.
        4-значный перебирается за ≤ 10 000 запросов. Предложение: `429 rateLimited` с `Retry-After` после N неверных PIN
        (касса на любую ошибку входа показывает её текст — apps/admin/src/App.tsx:193-201). В контракт как норма не
        внесено до решения владельца.
      x-server-status: required
      x-roles:
        - owner
        - cashier
      x-source:
        - apps/admin/src/api.ts:502
        - apps/admin/src/api.ts:106
        - apps/admin/src/App.tsx:193
        - tools/MockServer/src/routes/club.ts:136
      security: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
            examples:
              pin:
                value:
                  pin: '1111'
      responses:
        '200':
          description: Вход выполнен.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, `details.reason = "invalidPin"` — нет активного сотрудника с таким PIN.'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/me:
    get:
      tags:
        - admin
      operationId: adminMe
      summary: Текущий сотрудник и открытая смена
      description: |
        Проверка сохранённого токена при старте кассы и обновление смены. На ошибку касса сбрасывает токен.
      x-server-status: required
      x-roles:
        - owner
        - cashier
      x-source:
        - apps/admin/src/api.ts:504
        - apps/admin/src/App.tsx:300
        - apps/admin/src/App.tsx:320
        - tools/MockServer/src/routes/club.ts:147
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Сотрудник и смена.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, `details.reason = "invalid"` — нет/неверный токен персонала или сотрудник отключён.'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------------------------------------------------------
  # Персонал
  # ------------------------------------------------------------------------------------------------------------------

  /admin/staff:
    get:
      tags:
        - admin
      operationId: adminStaff
      summary: Список сотрудников
      description: Все сотрудники клуба, включая отключённых; PIN не отдаётся.
      x-server-status: required
      x-roles:
        - owner
      x-source:
        - apps/admin/src/api.ts:506
        - apps/admin/src/pages/StaffPage.tsx:70
        - tools/MockServer/src/routes/club.ts:152
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Сотрудники.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStaffList'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, `details.reason = "invalid"` — нет/неверный токен персонала или сотрудник отключён.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`forbidden`, `details.reason = "ownerOnly"` — нужна роль владельца.'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - admin
      operationId: adminAddStaff
      summary: Добавить сотрудника
      description: |
        Создаёт активного сотрудника. PIN — 4–8 цифр и уникален в клубе (вход только по PIN).
        Ошибки `400 validation`: `field = pin`, `reason` ∈ `digits4to8` | `taken`; `field = name`, `reason = required`.
      x-server-status: required
      x-roles:
        - owner
      x-source:
        - apps/admin/src/api.ts:507
        - apps/admin/src/pages/StaffPage.tsx:172
        - tools/MockServer/src/routes/club.ts:157
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStaffCreateRequest'
      responses:
        '200':
          description: Сотрудник создан.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStaffCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, `details.reason = "invalid"` — нет/неверный токен персонала или сотрудник отключён.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`forbidden`, `details.reason = "ownerOnly"` — нужна роль владельца.'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/staff/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор сотрудника (непрозрачная строка).
        schema:
          type: string
    patch:
      tags:
        - admin
      operationId: adminUpdateStaff
      summary: Изменить сотрудника
      description: |
        Частичное изменение: имя, включение/отключение, новый PIN. Отключение действует сразу — все токены
        сотрудника перестают приниматься. Отключить самого себя нельзя.
        Ошибки `400 validation`: `field = active`, `reason = self`; `field = pin`, `reason = digits4to8`. Нет
        сотрудника — `404`, `details.what = "staff"`.
      x-open-question: >-
        Уникальность PIN при изменении. `POST /admin/staff` отвергает занятый PIN (`reason = taken`,
        tools/MockServer/src/routes/club.ts:163), а `PATCH` проверяет только формат `^\d{4,8}$` (routes/club.ts:180-184).
        Вход ищет первого активного сотрудника с таким PIN (routes/club.ts:139), поэтому дубликат PIN впускает под чужой
        учёткой. Предложение: и в `PATCH` отвечать `400 validation`, `field = pin`, `reason = taken`. В контракт как
        норма не внесено до решения владельца.
      x-server-status: required
      x-roles:
        - owner
      x-source:
        - apps/admin/src/api.ts:509
        - apps/admin/src/pages/StaffPage.tsx:128
        - apps/admin/src/pages/StaffPage.tsx:149
        - tools/MockServer/src/routes/club.ts:170
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStaffUpdateRequest'
      responses:
        '200':
          description: Изменено (касса тело не читает).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, `details.reason = "invalid"` — нет/неверный токен персонала или сотрудник отключён.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`forbidden`, `details.reason = "ownerOnly"` — нужна роль владельца.'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------------------------------------------------------
  # Смены
  # ------------------------------------------------------------------------------------------------------------------

  /admin/shift:
    get:
      tags:
        - admin
      operationId: adminShift
      summary: Текущая смена, X-отчёт, история
      description: |
        Открытая смена клуба (одна на клуб), её X-отчёт с момента открытия и последние закрытые смены. Касса опрашивает
        каждые 5 с.
      x-server-status: required
      x-roles:
        - owner
        - cashier
      x-source:
        - apps/admin/src/api.ts:512
        - apps/admin/src/pages/ShiftPage.tsx:114
        - tools/MockServer/src/routes/club.ts:190
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Состояние смены.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminShiftState'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, `details.reason = "invalid"` — нет/неверный токен персонала или сотрудник отключён.'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/shift/open:
    post:
      tags:
        - admin
      operationId: adminOpenShift
      summary: Открыть смену
      description: |
        Открывает смену от имени текущего сотрудника с указанной наличностью в кассе; пишет `shiftOpen` в журнал
        контроля. Смена уже открыта — `409 conflict`, `details.reason = "shiftOpen"`.
      x-server-status: required
      x-roles:
        - owner
        - cashier
      x-source:
        - apps/admin/src/api.ts:513
        - apps/admin/src/pages/ShiftPage.tsx:134
        - tools/MockServer/src/routes/club.ts:203
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminShiftOpenRequest'
      responses:
        '200':
          description: Смена открыта.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminShiftOpenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, `details.reason = "invalid"` — нет/неверный токен персонала или сотрудник отключён.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`conflict`, `details.reason = "shiftOpen"` — смена уже открыта.'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/shift/close:
    post:
      tags:
        - admin
      operationId: adminCloseShift
      summary: Закрыть смену (Z-отчёт)
      description: |
        Закрывает открытую смену (любой сотрудник, не только открывший): фиксирует пересчитанную наличность, считает
        Z-отчёт и ожидаемую наличность (`openingCash + topUpCash`). Пишет `shiftClose` в журнал; недостача больше
        `control.shortfallFrom` — флаг `shortfall` и событие `suspicious`; всегда — событие `shiftClosed`.
        Смены нет — `409 conflict`, `details.reason = "noShift"`.
      x-server-status: required
      x-roles:
        - owner
        - cashier
      x-source:
        - apps/admin/src/api.ts:514
        - apps/admin/src/pages/ShiftPage.tsx:149
        - tools/MockServer/src/routes/club.ts:222
        - tools/MockServer/src/control.ts:209
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminShiftCloseRequest'
      responses:
        '200':
          description: Смена закрыта.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminShiftCloseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, `details.reason = "invalid"` — нет/неверный токен персонала или сотрудник отключён.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`conflict`, `details.reason = "noShift"` — смена не открыта.'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------------------------------------------------------
  # Касса: карта зала, сеансы, пополнение, команды ПК
  # ------------------------------------------------------------------------------------------------------------------

  /admin/overview:
    get:
      tags:
        - admin
      operationId: adminOverview
      summary: Карта зала для кассы
      description: |
        Места с сессиями и игроками, тарифы, клиенты для выбора, зоны и метки ремонта. Касса опрашивает каждые 2 с
        (WebSocket для кассы в контракте нет).
      x-server-status: required
      x-roles:
        - owner
        - cashier
      x-source:
        - apps/admin/src/api.ts:131
        - apps/admin/src/App.tsx:318
        - apps/admin/src/pages/MapPage.tsx:473
        - tools/MockServer/src/routes/admin.ts:83
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Снимок зала.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, `details.reason = "invalid"` — нет/неверный токен персонала или сотрудник отключён.'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/sessions:
    post:
      tags:
        - admin
      operationId: adminOpenSession
      summary: Открыть сессию клиенту на месте
      description: |
        Открывает предоплаченную сессию: цена по правилам клуба (как `POST /admin/quote`), списание с основного баланса
        сразу (`charge`). Агенту уходит `sessionUpdated`, всем — `pcStatusChanged` (busy), клиенту — `walletUpdated`;
        срабатывают правила `sessionStarted`/`visitCount`, событие `sessionOpened`, журнал `sessionOpen`.

        Ошибки:
        - `404 notFound`, `details.what` ∈ `pc` | `user` | `tariff`.
        - `403 policyDenied`, `details.rule` ∈ `pcMaintenance` | `blacklisted` | `minorCurfew`.
        - `409 sessionAlreadyActive` — на ПК уже есть сессия (`details.pcId`) или у клиента открыта другая
          (`details: { sessionId, pcId }`).
        - `402 insufficientFunds` — `details: { required, available }`.
      x-server-status: required
      x-roles:
        - owner
        - cashier
      x-source:
        - apps/admin/src/api.ts:132
        - apps/admin/src/pages/MapPage.tsx:396
        - tools/MockServer/src/routes/admin.ts:98
        - tools/MockServer/src/club.ts:511
        - tools/MockServer/src/club.ts:642
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOpenSessionRequest'
      responses:
        '201':
          description: Сессия открыта; `session`, `charged`, `balance`.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceIdResponse'
            X-Server-Time:
              $ref: '#/components/headers/XServerTime'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`unauthorized`, `details.reason = "invalid"` — нет/неверный токен персонала или сотрудник отключён.'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`policyDenied`, `details.rule` ∈ `pcMaintenance` | `blacklisted` | `minorCurfew`.'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sessionAlreadyActive` — на ПК или у клиента уже открыта сессия.'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/sessions/extend:
    post:
      tags:
        - admin
      operationId: adminExtend
      summary: Добавить время к сессии
      description: |
        Докупает минуты к открытой предоплаченной сессии (по `pcId` или `sessionId`) по цене клуба; тариф продления
        становится тарифом сессии, предупреждения сбрасываются. Агенту — `sessionUpdated`, клиенту — `walletUpdated`;
        журнал `sessionExtend`.

        Ошибки: нет открытой сессии — `404`, `details.what = "session"`; `404` `tariff`/`user`; постоплатная сессия —
        `409 conflict`, `details.reason = "postpaidSession"`; не хватает средств — `402 insufficientFunds`.
      x-server-status: required
      x-roles:
        - owner
        - cashier
      x-source:
        - apps/admin/src/api.ts:134
        - apps/admin/src/pages/MapPage.tsx:268
        - tools/MockServer/src/routes/admin.ts:165
      security:
        - staffBearer: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminExtendSessionRequest'
      responses:
        '200':
          description: Время добавлено; `session`, `charged`, `balance`.
          headers:
