name: contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # bundle --check: openapi.yaml собран из актуальных фрагментов; затем Redocly и AsyncAPI validate
      - run: npm run check

  breaking:
    # Удалять и переименовывать можно только в /api/v2: ломающие изменения относительно базовой ветки — ошибка.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show "origin/${{ github.base_ref }}:openapi/openapi.yaml" > /tmp/base-openapi.yaml
      - run: >-
          docker run --rm -v /tmp:/base -v "$PWD":/rev tufin/oasdiff
          breaking /base/base-openapi.yaml /rev/openapi/openapi.yaml --fail-on ERR
